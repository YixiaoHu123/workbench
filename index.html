<title>个人工作台 · Personal Workbench</title>
<style>
/* ============================================================
   Design Tokens —— 严格对应 PRD 第 2/3/4 节
   ============================================================ */
:root{
  /* Brand & accent */
  --primary:#33475B; --accent:#4C8C9B; --accent-pressed:#3E7482;
  --success:#4C8C9B; --warning:#D9A441; --danger:#C15B4E;
  /* Neutral (Light) */
  --bg-base:#F7F8FA; --bg-card:#FFFFFF; --bg-elev:#FFFFFF;
  --divider:#E8EBEF; --text-1:#1F2A36; --text-2:#5C6B7A; --text-3:#9AA6B2;
  /* Heatmap 5 阶 (Light) */
  --hm0:#EDF0F2; --hm1:#CDE3E8; --hm2:#93C4CE; --hm3:#5FA2B0; --hm4:#1E5F74;
  /* Shadow */
  --shadow:0 2px 8px rgba(31,42,54,.06);
  /* Radius */
  --r-card:16px; --r-sheet:20px; --r-btn:12px; --r-chip:8px;
}
html[data-theme="dark"]{
  --primary:#8FA9BF; --accent:#4C8C9B; --accent-pressed:#47A6B8;
  --success:#58C0D4; --warning:#E6B85C; --danger:#D97768;
  --bg-base:#0F1620; --bg-card:#1A2430; --bg-elev:#22303C;
  --divider:#2A3644; --text-1:#EAEEF2; --text-2:#9BAAB8; --text-3:#6B7A88;
  --hm0:#22303C; --hm1:#2E5561; --hm2:#3B7C8C; --hm3:#469FB2; --hm4:#58C0D4;
  --shadow:none;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;font-family:-apple-system,"SF Pro Text","PingFang SC",system-ui,sans-serif;
  background:#c9ccd1;color:var(--text-1);
  /* lock the whole page: never scroll the frame, only inner .screen scrolls (native-app feel) */
  height:100%;overflow:hidden;position:fixed;top:0;left:0;right:0;bottom:0;width:100%;overscroll-behavior:none;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,textarea{font-family:inherit;}

/* ============================================================
   Phone frame —— 逻辑分辨率 402×936
   ============================================================ */
.stage{height:100dvh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:0;gap:24px;flex-wrap:wrap;overflow:hidden;}
.phone{width:min(402px,100vw);height:min(936px,100dvh);max-height:100dvh;background:var(--bg-base);border-radius:0;position:relative;overflow:hidden;
  box-shadow:0 20px 60px rgba(0,0,0,.28);transition:background .3s;}
/* 窄屏(真机浏览器/迁移到其它手机)直接铺满整屏,去掉桌面外框留白 */
@media (max-width:440px),(max-height:960px){
  .stage{padding:0;gap:0;}
  .phone{width:100vw;height:100dvh;max-height:100dvh;box-shadow:none;}
}
/* status bar */
/* 顶端固定占位格:高 62pt,无边框,像一张图片一样顶住顶部空间;正文在其下方展示 */
.top-spacer{height:62px;flex:none;background:var(--bg-base);position:relative;z-index:5;transition:background .3s;}
.statusbar .right{display:flex;gap:6px;align-items:center;}
#clock{display:none;}   /* 隐藏页面内时钟,避免与手机系统时间重复 */
/* content scroll area */
.screen{position:absolute;top:110px;bottom:calc(63px + env(safe-area-inset-bottom,0px));left:0;right:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;}
.screen::-webkit-scrollbar{width:0;}
.page{display:none;padding:0 16px 24px;animation:fade .2s ease;}
.page.active{display:block;}
@keyframes fade{from{opacity:0}to{opacity:1}}
/* tab bar —— 高度含安全区,底部内边距用 env(safe-area-inset-bottom) 自适应,
   无安全区(桌面/预览)时贴底,消除底部悬空空白 */
.tabbar{position:absolute;bottom:0;left:0;right:0;height:calc(63px + env(safe-area-inset-bottom,0px));background:var(--bg-card);
  border-top:1px solid var(--divider);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:10;transition:background .3s;}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font-size:10px;color:var(--text-3);}
.tabbar button.active{color:var(--accent);}
.tabbar svg{width:24px;height:24px;}

/* ============================================================
   Common components
   ============================================================ */
.h1{font-size:22px;font-weight:600;letter-spacing:-.3px;margin:16px 0 4px;}
.sub{font-size:13px;color:var(--text-2);margin-bottom:14px;}
.card{background:var(--bg-card);border-radius:var(--r-card);padding:16px;box-shadow:var(--shadow);margin-bottom:12px;transition:background .3s,transform .12s;}
html[data-theme="dark"] .card{border:1px solid var(--divider);}
.h2{font-size:18px;font-weight:600;letter-spacing:-.2px;margin:0 0 12px;display:flex;align-items:center;justify-content:space-between;}
.h2 .link{font-size:13px;color:var(--accent);font-weight:500;}
.btn{height:48px;border-radius:var(--r-btn);background:var(--accent);color:#fff;font-size:15px;font-weight:600;
  display:flex;align-items:center;justify-content:center;gap:6px;width:100%;transition:background .15s,transform .12s;}
.btn:active{background:var(--accent-pressed);transform:scale(.98);}
.btn.ghost{background:transparent;border:1.5px solid var(--divider);color:var(--text-1);}
.btn.danger{background:var(--danger);}
.btn.sm{height:38px;font-size:13px;width:auto;padding:0 16px;}
/* segmented control */
.seg{height:32px;background:var(--bg-base);border-radius:8px;display:flex;padding:3px;margin-bottom:14px;}
html[data-theme="dark"] .seg{background:#0b1119;}
.seg button{flex:1;font-size:13px;font-weight:500;color:var(--text-2);border-radius:6px;transition:all .18s;}
.seg button.active{background:var(--bg-card);color:var(--primary);font-weight:600;box-shadow:0 1px 4px rgba(0,0,0,.08);}
/* empty state */
.empty{text-align:center;padding:32px 16px;color:var(--text-3);}
.empty .ico{font-size:40px;margin-bottom:10px;opacity:.5;}
.empty p{font-size:13px;margin:4px 0;}
/* progress bar */
.prog-track{height:8px;border-radius:4px;background:var(--divider);overflow:hidden;}
.prog-fill{height:100%;border-radius:4px;background:var(--accent);transition:width .5s ease;}
/* chips */
.chip{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 10px;border-radius:8px;background:var(--bg-base);
  font-size:12px;color:var(--text-2);}
html[data-theme="dark"] .chip{background:#0b1119;}

/* Heatmap */
.hm-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.hm-cell{aspect-ratio:1;border-radius:8px;background:var(--hm0);display:flex;align-items:center;justify-content:center;
  font-size:10px;color:var(--text-3);cursor:pointer;transition:transform .12s;position:relative;}
.hm-cell.blank{background:transparent;cursor:default;pointer-events:none;}
.hm-cell:active{transform:scale(.9);}
.hm-cell[data-lv="1"]{background:var(--hm1);}
.hm-cell[data-lv="2"]{background:var(--hm2);}
.hm-cell[data-lv="3"]{background:var(--hm3);}
.hm-cell[data-lv="4"]{background:var(--hm4);}
.hm-cell.today{outline:1.5px solid var(--accent);outline-offset:-1.5px;}
.hm-legend{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text-3);margin-top:10px;justify-content:flex-end;}
.hm-legend .sq{width:12px;height:12px;border-radius:3px;}
/* month navigator + weekday header + row labels */
.hm-nav{display:flex;align-items:center;justify-content:flex-end;gap:12px;font-size:13px;color:var(--text-1);margin-bottom:10px;font-weight:500;}
.hm-nav .arw{font-size:16px;color:var(--text-2);cursor:pointer;padding:2px 6px;}
.hm-month{display:grid;grid-template-columns:36px repeat(7,1fr);gap:4px;align-items:center;}
.hm-wd{font-size:10px;color:var(--text-3);text-align:center;padding-bottom:2px;}
.hm-rl{font-size:10px;color:var(--text-3);text-align:left;white-space:nowrap;}
/* year dense grid 23 cols × 16 rows = 368 cells, compact so a full year always fits without overflow */
.hm-year{display:grid;grid-template-columns:repeat(23,1fr);grid-auto-rows:1fr;gap:3px;height:100%;}
.hm-year .hm-cell{border-radius:3px;}
/* fixed-size calendar viewport: week/month/year keep identical width & height (no jump) */
#heatmap{height:296px;display:flex;flex-direction:column;}
#heatmap .hm-body{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;}
#heatmap .hm-grid,#heatmap .hm-month,#heatmap .hm-year,#heatmap .hm-week{width:100%;}
#heatmap .hm-month{height:100%;grid-auto-rows:1fr;align-items:stretch;}
#heatmap .hm-month .hm-cell{aspect-ratio:auto;height:100%;}
#heatmap .hm-year{height:100%;}
#heatmap .hm-year .hm-cell{aspect-ratio:auto;width:100%;height:100%;min-width:0;}
#heatmap .hm-month .hm-wd,#heatmap .hm-month .hm-rl{align-self:center;}
/* week bar chart */
.hm-week{display:flex;height:100%;gap:6px;}
.hm-yaxis{width:26px;flex-shrink:0;display:flex;flex-direction:column;}
.hm-yaxis-plot{flex:1;position:relative;}
.hm-yaxis .yt{position:absolute;right:0;transform:translateY(50%);font-size:9px;color:var(--text-3);line-height:1;}
.hm-yaxis-x{height:21px;}
.hm-bars{flex:1;display:flex;align-items:flex-end;justify-content:space-between;gap:8px;height:100%;}
.hm-bar-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;cursor:pointer;}
.hm-bar-stack{flex:1;width:100%;display:flex;flex-direction:column;justify-content:flex-end;}
.hm-bar-fill{width:100%;max-width:26px;margin:0 auto;position:relative;display:flex;flex-direction:column;justify-content:flex-end;transition:height .3s ease;border-radius:6px 6px 0 0;}
.hm-bar-val{position:absolute;bottom:100%;left:0;right:0;text-align:center;font-size:10px;color:var(--text-2);font-weight:600;margin-bottom:2px;}
.hm-seg{width:100%;transition:height .3s ease;}
.hm-seg:first-child{border-radius:6px 6px 0 0;}
.hm-bar-x{font-size:10px;color:var(--text-3);height:16px;line-height:16px;margin-top:5px;}
.hm-bar-x.today{color:var(--accent);font-weight:700;}

/* Donut legend */
.donut-wrap{display:flex;align-items:center;gap:16px;}
.donut{width:130px;height:130px;flex-shrink:0;position:relative;}
.donut .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.donut .center b{font-size:24px;font-weight:600;letter-spacing:-.4px;}
.donut .center span{font-size:11px;color:var(--text-3);}
.legend{flex:1;}
.legend-row{display:flex;align-items:center;gap:8px;font-size:13px;padding:3px 0;}
.legend-row .sq{width:10px;height:10px;border-radius:3px;flex-shrink:0;}
.legend-row .nm{flex:1;color:var(--text-1);}
.legend-row .hr{color:var(--text-2);font-size:12px;}

/* Habit layout */
.habit-wrap{display:flex;gap:0;margin:0 -16px;position:relative;min-height:640px;}
.rail{width:28px;flex-shrink:0;background:transparent;border-right:none;
  padding:8px 0;display:flex;flex-direction:column;align-items:center;gap:6px;transition:width .26s ease;overflow:visible;min-height:640px;}
.rail.expanded{width:180px;background:var(--bg-card);border-right:1px solid var(--divider);align-items:stretch;padding:8px;overflow:hidden;}
/* collapsed: hide everything except the floating pull arrow */
.rail:not(.expanded) .rail-item,.rail:not(.expanded) .rail-add{display:none;}
.rail-item{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;
  position:relative;transition:all .18s;flex-shrink:0;}
.rail.expanded .rail-item{width:100%;height:44px;justify-content:flex-start;padding:0 12px;gap:10px;font-size:18px;}
.rail-item .label{display:none;font-size:15px;color:var(--text-1);white-space:nowrap;}
.rail.expanded .rail-item .label{display:inline;}
.rail-item.active{background:color-mix(in srgb,var(--accent) 14%,transparent);}
.rail-item.active::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:2px;background:var(--accent);}
.rail-add{color:var(--accent);border:1.5px dashed var(--divider);}
/* floating pull arrow (collapsed) / collapse chevron (expanded) */
.rail-toggle{position:absolute;top:8px;left:2px;z-index:8;width:26px;height:40px;border-radius:8px;
  background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;
  box-shadow:0 2px 8px rgba(0,0,0,.18);cursor:pointer;}
.rail.expanded .rail-toggle{position:static;margin-left:auto;background:transparent;color:var(--text-3);box-shadow:none;width:40px;height:40px;}
.rail-toggle .label{display:none;}
.habit-main{flex:1;padding:8px 16px 0;min-width:0;}
/* horizontal, always-visible module switcher (replaces hidden floating arrow) */
.mod-switch{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;margin:0 -2px 2px;-webkit-overflow-scrolling:touch;}
.mod-switch::-webkit-scrollbar{height:0;}
.mod-chip{flex-shrink:0;display:flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:18px;
  background:var(--bg-card);border:1px solid var(--divider);font-size:14px;color:var(--text-1);white-space:nowrap;cursor:pointer;transition:all .16s;}
.mod-chip.active{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600;}
.mod-chip.add{color:var(--accent);border-style:dashed;}
/* 模块排序模式:chip 抖动 + 左右移动箭头 */
.mod-switch.reorder .mod-chip:not(.add):not(.reorder-done){animation:wobble .5s ease-in-out infinite;}
@keyframes wobble{0%,100%{transform:rotate(-1.4deg)}50%{transform:rotate(1.4deg)}}
.mod-chip .mv{display:none;width:18px;height:18px;border-radius:50%;background:rgba(0,0,0,.16);color:#fff;
  align-items:center;justify-content:center;font-size:13px;line-height:1;}
.mod-switch.reorder .mod-chip:not(.add) .mv{display:inline-flex;}
.mod-chip.active .mv{background:rgba(255,255,255,.32);}
.mod-chip.reorder-done{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600;}

/* Today check-in card */
.today-card{background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;border-radius:var(--r-card);
  padding:16px;margin-bottom:14px;position:relative;overflow:hidden;}
html[data-theme="dark"] .today-card{border:none;}
.today-card .lbl{font-size:12px;opacity:.85;}
.today-card .big{font-size:26px;font-weight:600;margin:4px 0 12px;letter-spacing:-.4px;}
.today-card .checkbtn{height:40px;border-radius:10px;background:rgba(255,255,255,.2);color:#fff;font-size:14px;font-weight:600;
  width:100%;display:flex;align-items:center;justify-content:center;gap:6px;backdrop-filter:blur(4px);}
.today-card .checkbtn:active{background:rgba(255,255,255,.32);}

/* Book grid —— 三列等宽,每格图片强制同尺寸(3:4),避免首图比其余大一圈 */
.book-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;align-items:start;}
.book{cursor:pointer;min-width:0;}
/* padding 撑高法锁定 3:4 比例,兼容 Safari;绝对定位内容填满,保证三列图片完全一致 */
.book .cover{width:100%;height:0;padding-top:133.33%;border-radius:8px;background:var(--bg-base);border:1px solid var(--divider);
  overflow:hidden;position:relative;}
.book .cover>.cover-ph,.book .cover>img{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:24px;color:var(--text-3);}
.book .cover img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;}
/* graphic placeholder when no photo uploaded (replaces bare emoji) */
.cover-ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 22%,var(--bg-card)),color-mix(in srgb,var(--primary) 26%,var(--bg-card)));}
.cover-ph svg{width:42%;height:42%;color:#fff;opacity:.9;}
.book .bt{font-size:13px;margin-top:6px;font-weight:500;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.book .ba{font-size:12px;color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.book .bmeta{font-size:11px;color:var(--text-3);line-height:1.4;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.book .prog-track{margin-top:5px;height:4px;}
/* light-colored "read" check badge, top-right of cover */
.done-badge{position:absolute;top:4px;right:4px;width:20px;height:20px;border-radius:50%;
  background:rgba(255,255,255,.82);color:var(--accent);font-size:13px;font-weight:700;
  display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.15);}

/* Task list (fitness) */
.tlist-item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--divider);align-items:center;}
.tlist-item:last-child{border-bottom:none;}
.tlist-item .thumb{width:56px;height:56px;border-radius:8px;background:var(--bg-base);flex-shrink:0;overflow:hidden;
  display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--text-3);}
.tlist-item .thumb img{width:100%;height:100%;object-fit:cover;}
.tlist-item .info{flex:1;min-width:0;}
.tlist-item .mt{font-size:16px;font-weight:600;}
.tlist-item .st{font-size:12px;color:var(--text-2);margin-top:3px;line-height:1.4;}

/* Diary timeline */
.diary-wrap{display:flex;gap:12px;align-items:flex-start;}
.timeline{width:52px;flex-shrink:0;position:sticky;top:8px;align-self:flex-start;
  max-height:calc(100vh - 220px);overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding:8px 0 8px 0;}
.timeline::-webkit-scrollbar{width:0;}
.timeline::before{content:"";position:absolute;left:23px;top:0;bottom:0;width:2px;background:var(--divider);}
.tl-node{position:relative;font-size:12px;font-weight:500;color:var(--text-2);margin-bottom:24px;padding-left:16px;cursor:pointer;transition:color .15s;}
.tl-node::before{content:"";position:absolute;left:1px;top:3px;width:8px;height:8px;border-radius:50%;background:var(--divider);transition:background .15s,transform .15s;}
.tl-node.active{color:var(--accent);font-weight:700;}
.tl-node.active::before{background:var(--accent);transform:scale(1.35);}
.diary-feed{flex:1;min-width:0;}
.diary-month-sticky{position:sticky;top:0;z-index:6;background:var(--bg-base);
  font-size:13px;font-weight:700;color:var(--accent);padding:6px 0 8px;margin-bottom:2px;}
.diary-month-sec{scroll-margin-top:40px;}
.diary-card{background:var(--bg-card);border-radius:var(--r-card);padding:16px;box-shadow:var(--shadow);margin-bottom:12px;}
html[data-theme="dark"] .diary-card{border:1px solid var(--divider);}
.diary-card .dtop{display:flex;justify-content:space-between;align-items:center;}
.diary-card .dtitle{font-size:16px;font-weight:600;}
.diary-card .dmeta{font-size:12px;color:var(--text-3);margin:4px 0 8px;display:flex;gap:8px;}
.diary-card .dbody{font-size:14px;color:var(--text-1);line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
.diary-card .datt{display:flex;gap:8px;margin-top:10px;}
.diary-card .datt .a{width:40px;height:40px;border-radius:6px;background:var(--bg-base);display:flex;align-items:center;justify-content:center;font-size:16px;overflow:hidden;}
.diary-card .datt .a img{width:100%;height:100%;object-fit:cover;}

/* ============================================================
   Modal / Bottom sheet
   ============================================================ */
.mask{position:absolute;inset:0;background:rgba(0,0,0,.4);z-index:50;display:none;animation:fade .25s;}
.mask.show{display:block;}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--bg-card);border-radius:var(--r-sheet) var(--r-sheet) 0 0;
  padding:12px 16px calc(20px + env(safe-area-inset-bottom));z-index:51;transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);max-height:88%;overflow-y:auto;}
.sheet.show{transform:translateY(0);}
.sheet::-webkit-scrollbar{width:0;}
.handle{width:36px;height:4px;border-radius:2px;background:var(--text-3);margin:0 auto 14px;opacity:.5;}
.sheet h3{font-size:18px;font-weight:600;margin:0 0 16px;}
.field{margin-bottom:16px;}
.field label{font-size:13px;color:var(--text-2);display:block;margin-bottom:6px;font-weight:500;}
.field input[type=text],.field input[type=number],.field textarea,.field select{
  width:100%;height:44px;border-radius:12px;background:var(--bg-base);border:1.5px solid transparent;
  padding:0 12px;font-size:15px;color:var(--text-1);transition:border .15s;}
.field textarea{height:auto;min-height:72px;padding:12px;resize:vertical;line-height:1.5;}
.field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--accent);}
html[data-theme="dark"] .field input,html[data-theme="dark"] .field textarea,html[data-theme="dark"] .field select{background:#0b1119;}
/* stepper */
.stepper{display:flex;align-items:center;gap:0;height:44px;border-radius:12px;background:var(--bg-base);overflow:hidden;width:160px;}
html[data-theme="dark"] .stepper{background:#0b1119;}
.stepper button{width:44px;height:44px;font-size:20px;color:var(--accent);}
.stepper input{flex:1;text-align:center;background:transparent;border:none;font-size:16px;color:var(--text-1);width:40px;}
/* stars */
.stars{display:flex;gap:8px;}
.stars .s{font-size:26px;color:var(--divider);cursor:pointer;transition:transform .1s;}
.stars .s.on{color:var(--accent);}
.stars .s:active{transform:scale(1.2);}
/* upload */
.upload{width:88px;height:88px;border:1.5px dashed var(--divider);border-radius:12px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:4px;color:var(--text-3);font-size:11px;cursor:pointer;position:relative;overflow:hidden;}
.upload img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.upload input{display:none;}
.upload .ic{font-size:22px;}
.att-row{display:flex;gap:8px;flex-wrap:wrap;}
.att-thumb{width:88px;height:88px;border-radius:12px;overflow:hidden;position:relative;}
.att-thumb img{width:100%;height:100%;object-fit:cover;}
.att-thumb .del{position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;}

/* toast */
.toast{position:absolute;bottom:100px;left:50%;transform:translateX(-50%) translateY(20px);background:rgba(31,42,54,.92);
  color:#fff;font-size:13px;padding:10px 18px;border-radius:20px;z-index:99;opacity:0;transition:all .3s;pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* manage list */
.manage-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--divider);}
.manage-item .ico{width:40px;height:40px;border-radius:10px;background:var(--bg-base);display:flex;align-items:center;justify-content:center;font-size:20px;}
.manage-item .nm{flex:1;font-size:15px;font-weight:500;}
.manage-item .form-tag{font-size:11px;color:var(--text-3);}
.manage-item .del{color:var(--danger);font-size:13px;font-weight:600;padding:6px 10px;border-radius:8px;}

/* top toolbar: a full-width bar sitting BELOW the 62pt top spacer (no button beside the dynamic island) */
.toolbar{position:absolute;top:62px;left:0;right:0;height:48px;z-index:7;display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:0 16px;background:var(--bg-base);border-bottom:1px solid var(--divider);transition:background .3s;}
.tool-btn{width:30px;height:30px;border-radius:50%;background:rgba(127,140,158,.15);display:flex;align-items:center;justify-content:center;font-size:15px;}

/* controls panel outside phone */
.ext-panel{width:280px;align-self:flex-start;margin-top:8px;}
.ext-panel .card2{background:#fff;border-radius:14px;padding:18px;box-shadow:0 6px 24px rgba(0,0,0,.12);font-size:13px;color:#333;line-height:1.6;}
.ext-panel h4{margin:0 0 10px;font-size:15px;}
.ext-panel .row{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
.ext-panel button{border:1px solid #ddd;border-radius:8px;padding:8px 12px;font-size:12px;background:#f7f8fa;}
.ext-panel button:hover{background:#eef0f3;}
.ext-panel code{background:#f0f0f0;padding:1px 5px;border-radius:4px;font-size:11px;}
.pop{position:absolute;top:110px;right:16px;background:var(--bg-card);border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.2);
  z-index:60;padding:6px;display:none;min-width:150px;border:1px solid var(--divider);}
.pop.show{display:block;}
.pop button{display:block;width:100%;text-align:left;padding:10px 12px;font-size:14px;border-radius:8px;color:var(--text-1);}
.pop button:hover{background:var(--bg-base);}
.pop button.danger{color:var(--danger);}

/* ===== PWA standalone: fill the whole screen, drop the desktop bezel ===== */
@media (display-mode:standalone),(display-mode:fullscreen){
  html,body{overflow:hidden;height:100dvh;position:fixed;width:100%;top:0;left:0;overscroll-behavior:none;}
  body{background:var(--bg-base);}
  .stage{display:block;padding:0;margin:0;height:100dvh;min-height:100dvh;}
  .ext-panel{display:none;}
  /* 用 fixed + inset 精确贴满可视视口:顶部到系统状态栏,底部到屏幕最底(含 home-indicator),彻底消除整体上移与底部留白 */
  .phone{position:fixed;top:0;left:0;right:0;bottom:0;width:100vw;height:100dvh;border-radius:0;box-shadow:none;}
  /* 顶端固定占位格:62pt + 系统安全区,像图片一样顶住顶部,彻底避开灵动岛/电量;正文在其下方 */
  .top-spacer{height:calc(62px + env(safe-area-inset-top,0px));flex:none;}
  .statusbar .right{display:none;}
  #clock{display:none;}
  /* 固定顶部条:承载浅/深色切换 + 菜单按钮,紧贴占位格下沿,整条横贯、右对齐 */
  .toolbar{top:calc(62px + env(safe-area-inset-top,0px));left:0;right:0;height:48px;display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:0 16px;background:var(--bg-base);border-bottom:1px solid var(--divider);z-index:7;}
  /* 菜单弹层挂在固定顶部条之下 */
  .pop{top:calc(62px + env(safe-area-inset-top,0px) + 48px);}
  /* 内容区从「占位格 + 固定顶部条(48px)」之下开始,底部贴到 tab bar 之上 */
  .screen{top:calc(62px + env(safe-area-inset-top,0px) + 48px);bottom:calc(60px + env(safe-area-inset-bottom,0px));}
  /* tab bar hugs the very bottom; only the home-indicator inset is added as padding */
  .tabbar{height:calc(60px + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);}
}

</style>
</head>
<body>
<div class="stage">
  <!-- ============ PHONE ============ -->
  <div class="phone" id="phone">
    <div class="top-spacer" id="topSpacer"><span id="clock">9:41</span></div>
    <div class="toolbar">
      <button class="tool-btn" id="themeBtn" title="切换主题">☾</button>
      <button class="tool-btn" id="menuBtn" title="菜单">⋯</button>
    </div>
    <div class="pop" id="menuPop">
      <button onclick="openManage()">⚙︎ 管理 / 删除习惯</button>
      <button onclick="exportData()">⬇︎ 导出数据 (备份到文件)</button>
      <button onclick="shareCloud()">☁︎ 云端上传 (微信 / 飞书)</button>
      <button onclick="importData()">⬆︎ 导入数据 (从文件恢复)</button>
      <button class="danger" onclick="resetAll()">⟲ 清空全部数据</button>
    </div>

    <div class="screen">
      <!-- ============ PAGE 1 : DASHBOARD ============ -->
      <div class="page active" id="page-dashboard">
        <div class="h1">数据看板</div>
        <div class="sub">你的时间投入与习惯完成总览</div>

        <div class="card">
          <div class="h2">任务完成日历</div>
          <div class="seg" id="calSeg">
            <button data-v="week">周</button>
            <button data-v="month" class="active">月</button>
            <button data-v="year">年</button>
          </div>
          <div id="heatmap"></div>
          <div class="hm-legend">
            少 <span class="sq" style="background:var(--hm0)"></span>
            <span class="sq" style="background:var(--hm1)"></span>
            <span class="sq" style="background:var(--hm2)"></span>
            <span class="sq" style="background:var(--hm3)"></span>
            <span class="sq" style="background:var(--hm4)"></span> 多
          </div>
        </div>

        <div class="card">
          <div class="h2">投入时间构成</div>
          <div class="seg" id="donutSeg">
            <button data-v="week">周</button>
            <button data-v="month" class="active">月</button>
            <button data-v="year">年</button>
          </div>
          <div id="donutArea"></div>
        </div>

        <div class="card">
          <div class="h2">月度核心 Top 5 <span class="link" onclick="openTopEditor()">编辑</span></div>
          <div id="topList"></div>
        </div>
      </div>

      <!-- ============ PAGE 2 : HABITS ============ -->
      <div class="page" id="page-habits">
        <div class="h1">习惯养成</div>
        <div class="sub">切换上方模块 · 顶部快速打卡</div>
        <div class="habit-wrap">
          <div class="rail" id="rail">
            <!-- rail items injected -->
          </div>
          <div class="habit-main" id="habitMain">
            <!-- habit content injected -->
          </div>
        </div>
      </div>

      <!-- ============ PAGE 3 : DIARY ============ -->
      <div class="page" id="page-diary">
        <div class="h1">日记 <span class="link" style="font-size:14px;float:right;margin-top:6px" onclick="openDiaryEditor()">＋ 写日记</span></div>
        <div class="sub">记录每天的所思所想与认知迭代</div>
        <div id="diaryArea"></div>
      </div>
    </div>

    <!-- ============ TAB BAR ============ -->
    <div class="tabbar" id="tabbar">
      <button class="active" data-tab="dashboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
        看板
      </button>
      <button data-tab="habits">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 6 9 17l-5-5"/></svg>
        习惯
      </button>
      <button data-tab="diary">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4h11l5 5v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1z"/><path d="M14 4v5h5"/></svg>
        日记
      </button>
    </div>

    <!-- ============ MODAL ============ -->
    <div class="mask" id="mask" onclick="closeSheet(event)"></div>
    <div class="sheet" id="sheet"></div>
    <div class="toast" id="toast"></div>
  </div>

  <!-- ============ EXTERNAL HELP PANEL (removed) ============ -->
</div>

<script>
/* ============================================================
   Data layer —— localStorage 本地持久化
   初始为空,示例数据需手动载入
   ============================================================ */
const KEY='workbench_v1';
const DEFAULT={
  habits:[],           // {id,name,icon,form:'flow'|'list'}
  logs:{},             // habitId: [{date,duration,content,rating,atts:[dataURL],bookId}]
  books:{},            // habitId: [{id,title,author,cover,progress}]  ← 阅读类书籍库,与打卡联动
  top5:[],             // {name,progress}
  top5Archive:{},      // 'YYYY-MM': [{name,progress}]  ← 每月归档快照
  diaries:[],          // {date,title,weather,mood,body,atts:[{type,url}]}
  currentBook:'',      // 当前在读书籍 id(阅读类)
  top5Month:'',        // 上次归档所属月份(YYYY-MM),用于跨月自动归档
  theme:'light'
};
let DB=load();
function load(){try{return migrate(Object.assign({},DEFAULT,JSON.parse(localStorage.getItem(KEY))||{}))}catch(e){return JSON.parse(JSON.stringify(DEFAULT))}}
/* 兼容旧数据:把旧版内嵌 log.book 迁移成独立书籍库 + bookId 关联 */
function migrate(db){
  db.books=db.books||{};
  db.top5Archive=db.top5Archive||{};
  if(!db.top5Month)db.top5Month=(new Date()).toISOString().slice(0,7);
  for(const h of (db.habits||[])){
    if(h.form!=='flow')continue;
    if(!h.curLabel)h.curLabel='正在阅读';
    if(!h.histLabel)h.histLabel='历史读过的所有书单';
    db.books[h.id]=db.books[h.id]||[];
    const byTitle={};db.books[h.id].forEach(b=>byTitle[b.title]=b);
    for(const l of (db.logs[h.id]||[])){
      if(l.bookId||!l.book||!l.book.title)continue;
      let b=byTitle[l.book.title];
      if(!b){b={id:uid(),title:l.book.title,author:l.book.author||'',cover:l.book.cover||'',progress:l.book.progress||0};db.books[h.id].push(b);byTitle[b.title]=b;}
      else{if(l.book.progress)b.progress=l.book.progress;if(l.book.cover&&!b.cover)b.cover=l.book.cover;}
      l.bookId=b.id;delete l.book;
    }
  }
  return db;
}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(DB));}catch(e){/* 配额满或隐私模式,静默 */}
  idbBackup();          // 同时写入 IndexedDB 冗余备份(iOS 上比 localStorage 更不易被清空)
}
/* ---- IndexedDB 冗余备份层 ---- */
/* iOS 主屏幕(standalone)模式下,localStorage 有可能被系统回收 / 与 Safari 隔离,
   导致"重新添加书签后数据消失"。这里额外把数据镜像到 IndexedDB,
   启动时若 localStorage 为空则自动从 IndexedDB 找回,双保险。 */
let _idb=null;
function idbOpen(){return new Promise((res,rej)=>{
  if(_idb)return res(_idb);
  if(!window.indexedDB)return rej('no-idb');
  const q=indexedDB.open('workbench_db',1);
  q.onupgradeneeded=e=>{const d=e.target.result;if(!d.objectStoreNames.contains('kv'))d.createObjectStore('kv');};
  q.onsuccess=e=>{_idb=e.target.result;res(_idb);};
  q.onerror=e=>rej(e);
});}
function idbBackup(){idbOpen().then(db=>{db.transaction('kv','readwrite').objectStore('kv').put(JSON.stringify(DB),KEY);}).catch(()=>{});}
function idbLoad(){return new Promise(res=>{idbOpen().then(db=>{const r=db.transaction('kv','readonly').objectStore('kv').get(KEY);r.onsuccess=()=>res(r.result||null);r.onerror=()=>res(null);}).catch(()=>res(null));});}
function dbIsEmpty(d){return (!d.habits||!d.habits.length)&&(!d.diaries||!d.diaries.length)&&Object.keys(d.logs||{}).length===0;}
/* 启动时:若本地为空,尝试从 IndexedDB 冗余备份恢复 */
function idbRestoreIfEmpty(){
  if(!dbIsEmpty(DB))return;
  idbLoad().then(js=>{
    if(!js)return;
    try{const d=migrate(Object.assign({},JSON.parse(JSON.stringify(DEFAULT)),JSON.parse(js)));
      if(!dbIsEmpty(d)){DB=d;save();applyTheme();renderDashboard();renderHabits();renderDiary();toast('已从本地备份自动找回数据');}
    }catch(e){}
  });
}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
const today=()=>new Date().toISOString().slice(0,10);

/* ============================================================
   Theme
   ============================================================ */
function applyTheme(){document.documentElement.dataset.theme=(DB.theme==='dark'?'dark':'light');const b=document.getElementById('themeBtn');if(b)b.textContent=(DB.theme==='dark'?'☀':'☾');}
document.getElementById('themeBtn').addEventListener('click',function(e){e.stopPropagation();DB.theme=(DB.theme==='dark')?'light':'dark';save();applyTheme();});

/* ============================================================
   Clock
   ============================================================ */
function tick(){const d=new Date();document.getElementById('clock').textContent=d.getHours()+':'+String(d.getMinutes()).padStart(2,'0');}
tick();setInterval(tick,10000);

/* ============================================================
   Menu popover
   ============================================================ */
const menuPop=document.getElementById('menuPop');
document.getElementById('menuBtn').onclick=(e)=>{e.stopPropagation();menuPop.classList.toggle('show');};
document.addEventListener('click',()=>menuPop.classList.remove('show'));

/* ============================================================
   Tabs
   ============================================================ */
document.getElementById('tabbar').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  switchTab(b.dataset.tab);
});
function switchTab(tab){
  document.querySelectorAll('.tabbar button').forEach(x=>x.classList.toggle('active',x.dataset.tab===tab));
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('page-'+tab).classList.add('active');
  if(tab==='dashboard')renderDashboard();
  if(tab==='habits')renderHabits();
  if(tab==='diary')renderDiary();
}

/* ============================================================
   TOAST
   ============================================================ */
let toastTimer;
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),1800);}

/* ============================================================
   SHEET (bottom modal)
   ============================================================ */
function openSheet(html){const s=document.getElementById('sheet');s.innerHTML='<div class="handle"></div>'+html;document.getElementById('mask').classList.add('show');requestAnimationFrame(()=>s.classList.add('show'));}
function closeSheet(e){if(e&&e.target&&e.target.id!=='mask'&&e!==true)return;document.getElementById('sheet').classList.remove('show');document.getElementById('mask').classList.remove('show');}

/* ============================================================
   DASHBOARD
   ============================================================ */
let calMode='month', donutMode='month', calMonthOffset=0, calWeekOffset=0, calYearOffset=0;
document.getElementById('calSeg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;calMode=b.dataset.v;document.querySelectorAll('#calSeg button').forEach(x=>x.classList.toggle('active',x===b));renderHeatmap();});
document.getElementById('donutSeg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;donutMode=b.dataset.v;document.querySelectorAll('#donutSeg button').forEach(x=>x.classList.toggle('active',x===b));renderDonut();});

// completion level for a date = number of distinct habits checked that day (cap 4)
function levelOf(date){let n=0;for(const hid in DB.logs){if((DB.logs[hid]||[]).some(l=>l.date===date))n++;}return Math.min(n,4);}
const HABIT_PALETTE=['#33475B','#4C8C9B','#7FB4BF','#A7CDD4','#D9A441','#C15B4E','#6B7A88'];
function habitColor(hid){const i=DB.habits.findIndex(h=>h.id===hid);return HABIT_PALETTE[(i<0?0:i)%HABIT_PALETTE.length];}
// per-day breakdown of durations by habit → [{hid,color,min}], for week bar chart
function dayBreakdown(ds){const out=[];for(const h of DB.habits){const l=(DB.logs[h.id]||[]).find(x=>x.date===ds);if(l&&(Number(l.duration)||0)>0)out.push({hid:h.id,color:habitColor(h.id),min:Number(l.duration)||0});}return out;}
function durationsBy(mode){
  const now=new Date();const totals={};
  for(const h of DB.habits){totals[h.id]=0;}
  for(const hid in DB.logs){for(const l of DB.logs[hid]){
    const d=new Date(l.date);let ok=false;
    if(mode==='week'){const diff=(now-d)/864e5;ok=diff>=0&&diff<7;}
    else if(mode==='month'){ok=d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear();}
    else{ok=d.getFullYear()===now.getFullYear();}
    if(ok)totals[hid]=(totals[hid]||0)+(Number(l.duration)||0);
  }}
  return totals;
}
function renderHeatmap(){
  const el=document.getElementById('heatmap');const tdy=today();
  const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const WD=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const WDC=['一','二','三','四','五','六','日'];
  const fmt=d=>d.toISOString().slice(0,10);
  el.removeAttribute('style');el.className='';
  if(calMode==='week'){
    // 目标周(可上/下翻),周一为起点
    const now=new Date();const base=new Date(now);base.setDate(now.getDate()+calWeekOffset*7);
    const dow=(base.getDay()+6)%7;const monday=new Date(base);monday.setDate(base.getDate()-dow);
    let days=[];for(let i=0;i<7;i++){const d=new Date(monday);d.setDate(monday.getDate()+i);days.push(d);}
    const mins=days.map(d=>dayBreakdown(fmt(d)).reduce((s,x)=>s+x.min,0));
    const totalMax=Math.max(0,...mins);
    // 默认封顶 100;单日总和超 100 时,轴顶向上取整到百位(175→200)
    const cap=totalMax>100?Math.ceil(totalMax/100)*100:100;
    const ticks=[cap*0.25,cap*0.5,cap*0.75,cap];
    const sun=days[6];
    const label=`${monday.getMonth()+1}/${monday.getDate()} - ${sun.getMonth()+1}/${sun.getDate()}`;
    const bars=days.map((d,i)=>{
      const ds=fmt(d);const tot=mins[i];
      const fillPct=cap?Math.min(100,Math.round(tot/cap*100)):0;
      // 单色:与月/年热力图完全一致 —— 颜色由当天等级 levelOf(ds) 决定,取同一组 --hm 变量
      const lv=levelOf(ds);const barColor=`var(--hm${lv>0?lv:1})`;
      return `<div class="hm-bar-col" onclick="showDay('${ds}')">
        <div class="hm-bar-stack">
          <div class="hm-bar-fill" style="height:${fillPct}%;background:${barColor}">
            <div class="hm-bar-val">${tot?tot:''}</div>
          </div>
        </div>
        <div class="hm-bar-x ${ds===tdy?'today':''}">${WDC[i]}</div>
      </div>`;
    }).join('');
    const yaxis=`<div class="hm-yaxis">
      <div class="hm-yaxis-plot">${ticks.map(t=>`<span class="yt" style="bottom:${Math.round(t/cap*100)}%">${Math.round(t)}</span>`).join('')}</div>
      <div class="hm-yaxis-x">&nbsp;</div>
    </div>`;
    el.innerHTML=`<div class="hm-nav"><span class="arw" onclick="calWeekOffset--;renderHeatmap()">‹</span><span>${label}</span><span class="arw" onclick="calWeekOffset++;renderHeatmap()">›</span></div>
      <div class="hm-body"><div class="hm-week">${yaxis}<div class="hm-bars">${bars}</div></div></div>`;
    return;
  }
  if(calMode==='month'){
    const base=new Date();const y=base.getFullYear();const m=base.getMonth()+calMonthOffset;
    const first=new Date(y,m,1);const yy=first.getFullYear(),mm=first.getMonth();
    const last=new Date(yy,mm+1,0).getDate();
    const start=new Date(yy,mm,1);const dow=(start.getDay()+6)%7;start.setDate(1-dow);
    const weeks=Math.ceil((dow+last)/7);
    let rows='';let cursor=new Date(start);
    for(let w=0;w<weeks;w++){
      const rowStart=new Date(cursor);
      let cells='';
      for(let i=0;i<7;i++){
        const inMonth=cursor.getMonth()===mm;
        const ds=fmt(cursor);
        cells+= inMonth
          ? `<div class="hm-cell ${ds===tdy?'today':''}" data-lv="${levelOf(ds)}" onclick="showDay('${ds}')"></div>`
          : `<div class="hm-cell blank"></div>`;
        cursor.setDate(cursor.getDate()+1);
      }
      const lbl=`${MON[rowStart.getMonth()]} ${rowStart.getDate()}`;
      rows+=`<div class="hm-rl">${lbl}</div>${cells}`;
    }
    el.innerHTML=`<div class="hm-nav"><span class="arw" onclick="calMonthOffset--;renderHeatmap()">‹</span><span>${MON[mm]} ${yy}</span><span class="arw" onclick="calMonthOffset++;renderHeatmap()">›</span></div>
      <div class="hm-body"><div class="hm-month"><div class="hm-wd"></div>${WD.map(w=>`<div class="hm-wd">${w}</div>`).join('')}${rows}</div></div>`;
    return;
  }
  // ===== year: compact dense grid 23 cols × 16 rows = 368 cells(整年 365/366 天全部容纳,可上/下翻年) =====
  const now=new Date();const y=now.getFullYear()+calYearOffset;
  let days=[];for(let i=0;i<368;i++){const d=new Date(y,0,1);d.setDate(d.getDate()+i);days.push(d);}
  const cells=days.map(d=>{const ds=fmt(d);return `<div class="hm-cell ${ds===tdy?'today':''}" data-lv="${levelOf(ds)}" onclick="showDay('${ds}')"></div>`;}).join('');
  el.innerHTML=`<div class="hm-nav"><span class="arw" onclick="calYearOffset--;renderHeatmap()">‹</span><span>${y}</span><span class="arw" onclick="calYearOffset++;renderHeatmap()">›</span></div>
    <div class="hm-body"><div class="hm-year">${cells}</div></div>`;
}
function showDay(ds){
  let rows=[];
  for(const h of DB.habits){
    const arr=DB.logs[h.id]||[];
    const idx=arr.findIndex(x=>x.date===ds);
    if(idx>=0){const l=arr[idx];rows.push({hid:h.id,icon:h.icon,name:h.name,dur:l.duration||0,idx});}
  }
  const body=rows.length?rows.map(r=>`<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
      <div class="chip" style="flex:1;height:auto;padding:8px 10px;cursor:pointer" onclick="closeSheet(true);activeHabit='${r.hid}';switchTab('habits');renderHabits()">${r.icon} ${r.name} · ${r.dur}min　<span style="color:var(--accent);font-size:11px">查看明细 &gt;</span></div>

}
function delDayLog(hid,idx,ds){

function renderDonut(){
  const area=document.getElementById('donutArea');
  const totals=durationsBy(donutMode);
  const items=DB.habits.map(h=>({name:h.name,icon:h.icon,val:totals[h.id]||0})).filter(x=>x.val>0).sort((a,b)=>b.val-a.val);
  const sum=items.reduce((s,x)=>s+x.val,0);
  if(sum===0){area.innerHTML='<div class="empty"><div class="ico">◔</div><p>暂无投入时间数据</p><p>去「习惯」页打卡后自动统计</p></div>';return;}
  const palette=['#33475B','#4C8C9B','#7FB4BF','#A7CDD4','#D9A441','#C15B4E','#6B7A88'];
  let acc=0;const segs=items.map((x,i)=>{const pct=x.val/sum*100;const s=`${palette[i%palette.length]} ${acc}% ${acc+pct}%`;acc+=pct;return s;});
  const hrs=(sum/60).toFixed(1);
  area.innerHTML=`<div class="donut-wrap">
    <div class="donut" style="background:conic-gradient(${segs.join(',')});border-radius:50%">
      <div style="position:absolute;inset:26px;background:var(--bg-card);border-radius:50%"></div>
      <div class="center"><b>${hrs}h</b><span>${donutMode==='week'?'本周':donutMode==='month'?'本月':'本年'}投入</span></div>
    </div>
    <div class="legend">${items.map((x,i)=>`<div class="legend-row"><span class="sq" style="background:${palette[i%palette.length]}"></span><span class="nm">${x.icon} ${x.name}</span><span class="hr">${(x.val/60).toFixed(1)}h</span></div>`).join('')}</div>
  </div>`;
}
let topViewOffset=0;   // 0=本月, -1=上月 ...
function ymOffset(off){const d=new Date();d.setMonth(d.getMonth()+off);return d.toISOString().slice(0,7);}
/* 跨月自动归档:进入新月份时,把上一个月的 Top5 快照存入 top5Archive */
function archiveTop5IfNeeded(){
  const nowM=(new Date()).toISOString().slice(0,7);
  if(DB.top5Month&&DB.top5Month!==nowM){
    if((DB.top5||[]).length)DB.top5Archive[DB.top5Month]=JSON.parse(JSON.stringify(DB.top5));
    DB.top5Month=nowM;save();
  }else if(!DB.top5Month){DB.top5Month=nowM;save();}
}
function renderTop5(){
  const el=document.getElementById('topList');
  archiveTop5IfNeeded();
  const nowM=(new Date()).toISOString().slice(0,7);
  const viewM=ymOffset(topViewOffset);
  const isCurrent=viewM===nowM;
  const list=isCurrent?(DB.top5||[]):(DB.top5Archive[viewM]||[]);
  // 月份导航条
  const [yy,mm]=viewM.split('-');
  const nav=`<div class="hm-nav" style="margin-bottom:12px"><span class="arw" onclick="topViewOffset--;renderTop5()">‹</span><span>${yy} 年 ${+mm} 月${isCurrent?' · 本月':' · 归档'}</span><span class="arw" style="${topViewOffset>=0?'opacity:.3;pointer-events:none':''}" onclick="topViewOffset++;renderTop5()">›</span></div>`;
  if(!list.length){el.innerHTML=nav+`<div class="empty"><div class="ico">◇</div><p>${isCurrent?'还没有月度核心任务':'该月没有归档记录'}</p>${isCurrent?'<p>点击右上「编辑」添加</p>':''}</div>`;return;}
  const sorted=[...list].sort((a,b)=>{const ca=a.progress>=100,cb=b.progress>=100;if(ca!==cb)return ca?1:-1;return b.progress-a.progress;});
  el.innerHTML=nav+sorted.map(t=>`<div style="margin-bottom:14px;opacity:${t.progress>=100?.55:1}">
    <div style="display:flex;justify-content:space-between;font-size:15px;margin-bottom:6px"><span style="font-weight:500">${t.progress>=100?'✓ ':''}${t.name}</span><span style="font-size:13px;color:var(--text-2)">${t.progress}%</span></div>
    <div class="prog-track"><div class="prog-fill" style="width:${t.progress}%"></div></div></div>`).join('');
}
function openTopEditor(){
  const rows=DB.top5.map((t,i)=>`<div style="margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--divider)">
    <div style="display:flex;gap:8px;align-items:center;margin-bottom:8px">
      <input type="text" value="${(t.name||'').replace(/"/g,'&quot;')}" oninput="DB.top5[${i}].name=this.value" style="flex:1;height:40px;border-radius:10px;background:var(--bg-base);border:1.5px solid transparent;padding:0 12px;font-size:15px;color:var(--text-1)">
      <button onclick="DB.top5.splice(${i},1);save();openTopEditor()" style="color:var(--danger);font-size:18px;width:30px">✕</button></div>
    <div style="display:flex;gap:10px;align-items:center">
      <input type="range" min="0" max="100" step="1" value="${t.progress||0}" oninput="DB.top5[${i}].progress=+this.value;this.nextElementSibling.textContent=this.value+'%'" style="flex:1;accent-color:var(--accent)">
      <span style="font-size:13px;color:var(--text-2);width:44px;text-align:right">${t.progress||0}%</span></div></div>`).join('');

let activeHabit=null, railExpanded=false, reorderMode=false, expandFlow=false;
/* 主标题按中文字符锁定 7 字:超出取前 7 + …,不撑宽卡片/图片 */
function clampTitle(t,n){t=(t==null?'':String(t));n=n||7;return[...t].length>n?[...t].slice(0,n).join('')+'…':t;}
/* graphic cover placeholder (replaces bare 📖 emoji fallback) */
const COVER_PH=`<div class="cover-ph"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.5"/><path d="M21 16l-5-5-6 6-3-3-4 4"/></svg></div>`;
function coverHTML(url){return url?`<img src="${url}">`:COVER_PH;}
function renderHabits(){
  const rail=document.getElementById('rail');
  rail.style.display='none';   // replaced by always-visible horizontal module switcher
  const main=document.getElementById('habitMain');
  if(!DB.habits.length){main.innerHTML='<div class="empty"><div class="ico">✦</div><p>还没有习惯模块</p><button class="btn" style="width:auto;padding:0 20px;margin:12px auto 0" onclick="openHabitEditor()">＋ 新建你的第一个习惯</button></div>';return;}
  if(!activeHabit||!DB.habits.find(h=>h.id===activeHabit))activeHabit=DB.habits[0].id;
  const h=DB.habits.find(x=>x.id===activeHabit);
  const logs=(DB.logs[h.id]||[]).slice().sort((a,b)=>b.date.localeCompare(a.date));
  const tlog=logs.find(l=>l.date===today());
  // —— 顶部水平模块切换 ——
  let html='<div class="mod-switch'+(reorderMode?' reorder':'')+'">';
  html+=DB.habits.map((x,i)=>{
    const act=x.id===activeHabit?'active':'';
    if(reorderMode){
      const left=i>0?`<span class="mv" onclick="event.stopPropagation();moveHabit('${x.id}',-1)">‹</span>`:'';
      const right=i<DB.habits.length-1?`<span class="mv" onclick="event.stopPropagation();moveHabit('${x.id}',1)">›</span>`:'';
      return `<div class="mod-chip ${act}">${left}<span>${x.icon}</span><span>${x.name}</span>${right}</div>`;
    }
    return `<div class="mod-chip ${act}" onclick="selectHabit('${x.id}')"><span>${x.icon}</span><span>${x.name}</span></div>`;
  }).join('');
  if(reorderMode){
    html+=`<div class="mod-chip reorder-done" onclick="toggleReorder()"><span>✓</span><span>完成</span></div></div>`;
  }else{
    html+=`<div class="mod-chip add" onclick="openHabitEditor()"><span>＋</span><span>新建</span></div><div class="mod-chip" onclick="toggleReorder()"><span>↔</span><span>排序</span></div></div>`;
  }
  if(h.form==='flow'){
    // ============ READING (match ref_reading.png) ============
    const books=DB.books[h.id]||[];
    const allLogs=DB.logs[h.id]||[];
    const timeByBook={};for(const l of allLogs){if(l.bookId)timeByBook[l.bookId]=(timeByBook[l.bookId]||0)+(Number(l.duration)||0);}
    const startByBook={};for(const l of allLogs){if(l.bookId){if(!startByBook[l.bookId]||l.date<startByBook[l.bookId])startByBook[l.bookId]=l.date;}}
    // 手动覆盖:书籍可编辑累计时长(totalMin)与开始日期(startDate),优先于自动统计
    for(const b of books){if(b.totalMin!=null&&b.totalMin!=='')timeByBook[b.id]=Number(b.totalMin)||0;if(b.startDate)startByBook[b.id]=b.startDate;}
    const isFinished=b=>!!b.finished||(b.progress||0)>=100;
    // 当前在读 = 最近点击的一本未读完的书(currentBook),否则第一本未读完
    const reading=books.filter(b=>!isFinished(b));
    let cur=reading.find(b=>b.id===DB.currentBook)||reading[0]||null;
    // —— 今日目标卡 ——
    html+=`<div class="today-card">
      <div class="lbl">${h.icon} ${h.name} · 今日目标</div>
      <div class="big">${tlog?(tlog.duration||0)+' 分钟':'0 分钟'}</div>
      <button class="checkbtn" onclick="openLogEditor('${h.id}'${cur?",'"+cur.id+"'":''})">＋ 今日打卡</button></div>`;
    // —— 正在阅读(可编辑标题;整卡点击=打卡&编辑,无额外按钮)——
    const curLabel=h.curLabel||'正在阅读';
    html+=`<div class="card"><div class="h2"><span>${curLabel}<span class="link" style="margin-left:6px;font-size:12px" onclick="editFlowLabel('${h.id}','cur')">✎</span></span><span class="link" onclick="openBookEditor('${h.id}','')">＋ 添加</span></div>`;
    if(cur){
      const cumH=((timeByBook[cur.id]||0)/60).toFixed(1);
      html+=`<div class="tlist-item" style="align-items:center;cursor:pointer" onclick="quickCheck('${h.id}','${cur.id}')">
        <div class="thumb" style="width:60px;height:80px">${coverHTML(cur.cover)}</div>
        <div class="info"><div class="mt">${cur.title}</div>
          <div class="st">${cur.author||'—'}</div>
          <div class="st">开始于 ${startByBook[cur.id]||'—'}</div>
          <div class="st" style="color:var(--accent);font-weight:600;margin-top:4px">累计阅读 ${cumH} 小时</div>
        </div></div>`;
    }else html+=`<div class="empty" style="padding:12px"><p>点右上「＋ 添加」登记在读的书,或今日打卡时新建</p></div>`;
    html+=`</div>`;
    // —— 历史信息流(最多 3 行 9 本;超出可「展开」内联全部;保留「查看全部」)——
    const histLabel=h.histLabel||'历史读过的所有书单';
    html+=`<div class="card"><div class="h2"><span>${histLabel} · ${books.length}<span class="link" style="margin-left:6px;font-size:12px" onclick="editFlowLabel('${h.id}','hist')">✎</span></span>${books.length>9?`<span class="link" onclick="openAllBooks('${h.id}')">查看全部 &gt;</span>`:''}</div>`;
    // 信息流固定只展示最近 9 个;当总数 >9 时通过右上角「查看全部」查看历史全部
    if(books.length){
      // 信息流固定只展示最近 9 个;历史全部走右上角「查看全部」入口
      const shown=books.slice().sort((a,b)=>(startByBook[b.id]||'').localeCompare(startByBook[a.id]||'')).slice(0,9);
      html+=`<div class="book-grid">${shown.map(b=>{
        const done=isFinished(b);
        // 已完成且已打分 → 展示最终评分五角星;进行中(未完成或未打分)→ 展示累计时长
        const scored=done&&b.rating;
        const metaLine=scored
          ? `<div class="bmeta" style="color:var(--accent)">${'★'.repeat(b.rating)+'☆'.repeat(5-b.rating)}</div>`
          : `<div class="bmeta" style="color:var(--accent);font-weight:600">累计 ${((timeByBook[b.id]||0)/60).toFixed(1)} 小时</div>`;
        return `<div class="book" onclick="openBookEditor('${h.id}','${b.id}')">
          <div class="cover">${coverHTML(b.cover)}${done?'<span class="done-badge">✓</span>':''}</div>
          <div class="bt" title="${b.title}">${clampTitle(b.title,7)}</div>
          <div class="ba" title="${b.author||''}">${clampTitle(b.author||'—',9)}</div>
          ${metaLine}
          <div class="bmeta">${startByBook[b.id]||'—'}</div>
        </div>`;
      }).join('')}</div>`;
    }else html+=`<div class="empty" style="padding:12px"><p>还没有记录,添加或今日打卡时新建</p></div>`;
    html+=`</div>`;
  }else{
    // ============ FITNESS / TASK LIST (Task #12 缩略卡片) ============
    html+=`<div class="today-card">
      <div class="lbl">${h.icon} ${h.name} · 今日</div>
      <div class="big">${tlog?(tlog.duration||0)+' 分钟':'未打卡'}</div>
      <button class="checkbtn" onclick="openLogEditor('${h.id}')">＋ 今日打卡</button></div>`;
    html+=`<div class="card"><div class="h2">历史记录 · ${logs.length}<span class="link" onclick="openLogEditor('${h.id}')">＋ 添加记录</span></div>`;
    if(logs.length){
      html+=logs.map((l,i)=>{
        const realIdx=(DB.logs[h.id]||[]).indexOf(l);
        const rate=l.rating?'★'.repeat(l.rating):'';
        return `<div class="tlist-item" style="cursor:pointer;align-items:stretch" onclick="openLogCard('${h.id}',${realIdx})">
          <div class="thumb" style="width:64px;height:64px">${l.atts&&l.atts[0]?`<img src="${l.atts[0]}">`:h.icon}</div>
          <div class="info">
            <div class="mt">${l.date} · ${l.duration||0} 分钟</div>
            <div class="st">${(l.content||'（无内容）').slice(0,20)}${(l.content||'').length>20?'…':''}</div>
            <div class="st" style="color:var(--accent)">${rate}</div>
            <div class="st" style="color:var(--text-3)">点击查看详情 &gt;</div>
          </div></div>`;
      }).join('');
    }else html+=`<div class="empty" style="padding:12px"><p>还没有历史记录,去打卡吧</p></div>`;
    html+=`</div>`;
  }
  main.innerHTML=html;
}
/* 查看全部书籍(历史读过的所有书单) */
function openAllBooks(hid){
  const h=DB.habits.find(x=>x.id===hid);
  const histLabel=(h&&h.histLabel)||'历史读过的所有书单';
  const books=(DB.books[hid]||[]).slice();
  const allLogs=DB.logs[hid]||[];
  const startByBook={};
  for(const l of allLogs){if(l.bookId){if(!startByBook[l.bookId]||l.date<startByBook[l.bookId])startByBook[l.bookId]=l.date;}}
  const timeByBook={};for(const l of allLogs){if(l.bookId)timeByBook[l.bookId]=(timeByBook[l.bookId]||0)+(Number(l.duration)||0);}
  for(const b of books){if(b.startDate)startByBook[b.id]=b.startDate;if(b.totalMin!=null&&b.totalMin!=='')timeByBook[b.id]=Number(b.totalMin)||0;}
  const isFinished=b=>!!b.finished||(b.progress||0)>=100;
  books.sort((a,b)=>(startByBook[b.id]||'').localeCompare(startByBook[a.id]||''));
  openSheet(`<h3>${histLabel} · ${books.length}</h3>
    <div class="book-grid">${books.map(b=>{const done=isFinished(b);const scored=done&&b.rating;const metaLine=scored?`<div class="bmeta" style="color:var(--accent)">${'★'.repeat(b.rating)+'☆'.repeat(5-b.rating)}</div>`:`<div class="bmeta" style="color:var(--accent);font-weight:600">累计 ${((timeByBook[b.id]||0)/60).toFixed(1)} 小时</div>`;return `<div class="book" onclick="closeSheet(true);openBookEditor('${hid}','${b.id}')"><div class="cover">${coverHTML(b.cover)}${done?'<span class="done-badge">✓</span>':''}</div><div class="bt" title="${b.title}">${clampTitle(b.title,7)}</div><div class="ba" title="${b.author||''}">${clampTitle(b.author||'—',9)}</div>${metaLine}<div class="bmeta">${startByBook[b.id]||'—'}</div></div>`;}).join('')}</div>
    <button class="btn ghost" style="margin-top:16px" onclick="closeSheet(true)">关闭</button>`);
}

function selectHabit(id){if(reorderMode)return;activeHabit=id;expandFlow=false;renderHabits();}
function toggleReorder(){reorderMode=!reorderMode;renderHabits();if(!reorderMode){save();toast('模块顺序已保存');}}
function moveHabit(id,dir){const i=DB.habits.findIndex(h=>h.id===id);if(i<0)return;const j=i+dir;if(j<0||j>=DB.habits.length)return;const t=DB.habits[i];DB.habits[i]=DB.habits[j];DB.habits[j]=t;save();renderHabits();}
function toggleExpandFlow(){expandFlow=!expandFlow;renderHabits();}
/* 可编辑标题:图片信息流的「正在阅读」(cur)与「历史…」(hist)标题 */
function editFlowLabel(hid,which){
  const h=DB.habits.find(x=>x.id===hid);if(!h)return;
  const isCur=which==='cur';
  const cur=isCur?(h.curLabel||'正在阅读'):(h.histLabel||'历史读过的所有书单');
  const val=prompt(isCur?'自定义「正在进行」标题(如:正在学习 / 正在训练 / 正在探索)':'自定义「历史」标题(如:历史完成 / 历史书单 / 历史品鉴)',cur);
  if(val===null)return;
  const v=val.trim();if(!v){toast('标题不能为空');return;}
  if(isCur)h.curLabel=v;else h.histLabel=v;

function saveLog(hid){
  const h=DB.habits.find(x=>x.id===hid);
  const isFlow=h.form==='flow';
  const editLog=editLogIdx!==null?(DB.logs[hid]||[])[editLogIdx]:null;
  const dateStr=editLog?editLog.date:today();
  const log={date:dateStr,duration:+document.getElementById('lDur').value||0,content:document.getElementById('lContent').value.trim(),rating:curStar,atts:logAtts.slice()};
  if(isFlow){
    DB.books[hid]=DB.books[hid]||[];
    const sel=document.getElementById('lBookSel');let bookId=sel?sel.value:'';
    if(bookId==='__new'||(!bookId&&document.getElementById('lBookT'))){
      const t=(document.getElementById('lBookT')||{}).value?document.getElementById('lBookT').value.trim():'';
      if(t){const nb={id:uid(),title:t,author:(document.getElementById('lBookA')||{}).value?document.getElementById('lBookA').value.trim():'',cover:logCover,finished:false};DB.books[hid].push(nb);bookId=nb.id;}
      else bookId='';
    }
    if(bookId){
      log.bookId=bookId;
      const b=DB.books[hid].find(x=>x.id===bookId);
      // 新书/未读完 → 设为当前在读;已读完的书打卡则不抢占当前位
      if(b&&!(b.finished||(b.progress||0)>=100))DB.currentBook=bookId;
    }
  }else{
    // 健身/清单:4 必填校验
    const title=document.getElementById('lTitle').value.trim();
    if(!log.duration){toast('请填写今日时长');return;}
    if(!title){toast('请填写今日内容');return;}
    if(!curStar){toast('请给出整体打分');return;}
    if(!log.content){toast('请填写详细备注');return;}
    log.title=title;
  }
  DB.logs[hid]=DB.logs[hid]||[];
  if(editLog!==null&&editLogIdx!==null){DB.logs[hid][editLogIdx]=log;}
  else{const ex=DB.logs[hid].findIndex(l=>l.date===dateStr);if(ex>=0)DB.logs[hid][ex]=log;else DB.logs[hid].push(log);}
  editLogIdx=null;curStar=0;save();closeSheet(true);renderHabits();renderDashboard();toast('✓ 今日已点亮日历');
}

let bookCover='',bookStar=0;
function setBookStar(v){bookStar=v;document.querySelectorAll('#bkStars .s').forEach(s=>s.classList.toggle('on',+s.dataset.v<=v));}
function setCurrentBook(hid,bookId){DB.currentBook=bookId;save();closeSheet(true);selectHabit(hid);toast('已设为正在阅读');}
function readBookCover(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=e=>{bookCover=e.target.result;document.getElementById('bkCoverPrev').innerHTML=`<img src="${bookCover}">`;};r.readAsDataURL(f);}
function saveBook(hid,bookId){
  const t=document.getElementById('bkT').value.trim();if(!t){toast('请填写主标题');return;}
  const a=document.getElementById('bkA').value.trim();
  const done=document.getElementById('bkDone')?document.getElementById('bkDone').checked:false;
  const review=document.getElementById('bkReview').value.trim();
  const minEl=document.getElementById('bkMin'),startEl=document.getElementById('bkStart');
  const totalMin=minEl?minEl.value.trim():'';const startDate=startEl?startEl.value:'';
  DB.books[hid]=DB.books[hid]||[];
  if(bookId){const b=DB.books[hid].find(x=>x.id===bookId);if(b){b.title=t;b.author=a;b.finished=done;b.rating=bookStar;b.review=review;if(bookCover)b.cover=bookCover;delete b.progress;
      if(totalMin!=='')b.totalMin=Number(totalMin)||0;else delete b.totalMin;
      if(startDate)b.startDate=startDate;else delete b.startDate;}
    if(!done)DB.currentBook=bookId;                                       // 未读完 → 成为当前在读
    else if(DB.currentBook===bookId)DB.currentBook='';                    // 读完 → 让出当前位
  }
  else{const nid=uid();DB.books[hid].push({id:nid,title:t,author:a,finished:done,rating:bookStar,review,cover:bookCover});if(!done)DB.currentBook=nid;}
  bookCover='';bookStar=0;save();closeSheet(true);renderHabits();toast(bookId?'书籍已更新':'书籍已添加');
}
function delBook(hid,bookId){
  if(!confirm('删除这本书?已有的打卡时长记录会保留,但不再关联书籍。'))return;
  DB.books[hid]=(DB.books[hid]||[]).filter(b=>b.id!==bookId);
  (DB.logs[hid]||[]).forEach(l=>{if(l.bookId===bookId)delete l.bookId;});
  if(DB.currentBook===bookId)DB.currentBook='';
  save();closeSheet(true);renderHabits();toast('已删除');
}

/* 滚动联动:根据当前可见的日记段更新左上粘性月标签与时间轴高亮 */
let _diaryScrollBound=false;
function bindDiaryScroll(){
  const screen=document.querySelector('#page-diary').closest('.screen')||document.querySelector('.screen');
  if(!screen)return;
  const handler=()=>{
    const page=document.getElementById('page-diary');
    if(!page.classList.contains('active'))return;
    const sticky=document.getElementById('diaryStickyLabel');
    const secs=[...document.querySelectorAll('.diary-month-sec')];
    if(!sticky||!secs.length)return;
    const anchorY=sticky.getBoundingClientRect().bottom;
    let cur=secs[0];
    for(const s of secs){if(s.getBoundingClientRect().top<=anchorY+4)cur=s;else break;}
    const k=cur.getAttribute('data-k');
    setDiaryActiveMonth(k);
  };
  if(!_diaryScrollBound){screen.addEventListener('scroll',handler,{passive:true});_diaryScrollBound=true;}
  handler();
}
function setDiaryActiveMonth(k){
  const sticky=document.getElementById('diaryStickyLabel');
  if(sticky)sticky.textContent=`${k.slice(0,4)}年${+k.slice(5)}月`;
  document.querySelectorAll('#diaryTimeline .tl-node').forEach(n=>n.classList.toggle('active',n.getAttribute('data-k')===k));
}
function jumpDiaryMonth(k){
  const sec=document.getElementById('dm-'+k);const screen=document.querySelector('.screen');
  if(!sec||!screen)return;
  const sticky=document.getElementById('diaryStickyLabel');
  const stickyH=sticky?sticky.offsetHeight+8:0;
  const top=screen.scrollTop+sec.getBoundingClientRect().top-screen.getBoundingClientRect().top-stickyH;

function exportData(){

  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();

  toast('已导出备份文件');

/* 云端上传:通过系统分享面板发送到微信 / 飞书等 */
async function shareCloud(){
  const name='workbench-backup-'+today()+'.json';
  const json=JSON.stringify(DB,null,2);
  const blob=new Blob([json],{type:'application/json'});
  try{
    const file=new File([blob],name,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:'工作台数据备份',text:'工作台数据备份 '+today()});
      localStorage.setItem('last_backup',today());toast('已调起分享,可发送到微信/飞书');return;
    }
    if(navigator.share){ // 不支持文件时退化为分享文本
      await navigator.share({title:'工作台数据备份',text:json});
      localStorage.setItem('last_backup',today());toast('已调起分享');return;
    }
  }catch(e){if(e&&e.name==='AbortError')return;/* 用户取消 */}
  // 完全不支持分享:退化为下载,提示手动上传
  exportData();toast('当前环境不支持直接分享,已导出文件,请手动上传到微信/飞书');
}
function importData(){
  const inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';
  inp.onchange=()=>{const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=e=>{try{
    const parsed=JSON.parse(e.target.result);
    DB=migrate(Object.assign({},JSON.parse(JSON.stringify(DEFAULT)),parsed));
    save();applyTheme();renderDashboard();renderHabits();renderDiary();toast('已导入并写入本地存储');
  }catch(err){toast('文件格式错误,导入失败');}};r.readAsText(f);};
  inp.click();
}
function resetAll(){if(!confirm('确认清空全部数据?此操作不可撤销。建议先「导出数据」备份。'))return;DB=JSON.parse(JSON.stringify(DEFAULT));save();applyTheme();activeHabit=null;renderDashboard();renderHabits();renderDiary();toast('已清空,回到初始态');}

/* ===== PWA: service worker (inline via Blob) for installability + offline shell ===== */
/* NOTE: The previous inline Blob-URL Service Worker was removed.
   On iOS, a SW registered via a blob: URL can hijack fetch requests and
   return empty responses in standalone (home-screen) mode, causing a blank
   screen and a false "lost network connection" error.
   We also proactively unregister any old SW and purge its cache so devices
   that already installed the broken version recover automatically. */
if('serviceWorker' in navigator){
  navigator.serviceWorker.getRegistrations()
    .then(rs=>rs.forEach(r=>r.unregister())).catch(()=>{});
}
if(window.caches){
  caches.keys().then(ks=>ks.forEach(k=>caches.delete(k))).catch(()=>{});
}

function seedHistory(){
  const S=HIST_SEED;
  // 1) 习惯模块:按 name 去重合入
  DB.habits=DB.habits||[];
  const habByName={};DB.habits.forEach(h=>habByName[h.name]=h);
  const idRemap={};   // seed habitId -> 实际 habitId
  for(const sh of S.habits){
    let h=habByName[sh.name];
    if(!h){h=JSON.parse(JSON.stringify(sh));DB.habits.push(h);habByName[h.name]=h;}
    idRemap[sh.id]=h.id;
  }
  // 2) 书籍:按「模块(实际hid)+标题」唯一键合并,时长取大、开始日期取早
  DB.books=DB.books||{};DB.logs=DB.logs||{};
  const bookIdRemap={};  // seed bookId -> 实际 bookId
  for(const shid in S.books){
    const hid=idRemap[shid];DB.books[hid]=DB.books[hid]||[];
    const byTitle={};DB.books[hid].forEach(b=>byTitle[b.title]=b);
    for(const sb of S.books[shid]){
      let b=byTitle[sb.title];
      if(!b){
        const nb={id:uid(),title:sb.title,author:sb.author||'',cover:sb.cover||'',
          finished:!!sb.finished,rating:sb.rating||0,review:sb.review||'',
          totalMin:sb.totalMin||0,startDate:sb.startDate||''};
        DB.books[hid].push(nb);byTitle[nb.title]=nb;bookIdRemap[sb.id]=nb.id;
      }else{
        // 冲突:累计时长取最大值
        const cur=(b.totalMin!=null&&b.totalMin!=='')?Number(b.totalMin)||0:0;
        b.totalMin=Math.max(cur,Number(sb.totalMin)||0);
        // 开始日期取较早
        if(sb.startDate&&(!b.startDate||sb.startDate<b.startDate))b.startDate=sb.startDate;
        // 评分/评价/封面:本地已有则不覆盖
        if(!b.rating&&sb.rating)b.rating=sb.rating;
        if(!b.review&&sb.review)b.review=sb.review;
        if(!b.cover&&sb.cover)b.cover=sb.cover;
        if(sb.finished)b.finished=true;
        bookIdRemap[sb.id]=b.id;
      }
    }
  }
  // 3) 打卡日志:按「日期+bookId」去重后合入
  for(const shid in S.logs){
    const hid=idRemap[shid];DB.logs[hid]=DB.logs[hid]||[];
    const seen={};DB.logs[hid].forEach(l=>seen[(l.date||'')+'|'+(l.bookId||'')]=true);
    for(const sl of S.logs[shid]){
      const bid=bookIdRemap[sl.bookId]||sl.bookId;
      const k=(sl.date||'')+'|'+bid;
      if(seen[k])continue;
      DB.logs[hid].push(Object.assign({},sl,{bookId:bid}));seen[k]=true;
    }
  }
  save();applyTheme();renderDashboard();renderHabits();renderDiary();
}

/* ============================================================
   DATA CLEAN —— 清洗最初设计代码的原始示例数据(一次性 demo_purge_v1)
   仅保留真实历史打卡记录;删除示例书/示例日志/示例日记/示例目标。
   ============================================================ */
const DEMO_BOOK_TITLES=['月亮与六便士','思考,快与慢','原则'];
const DEMO_HABIT_NAMES=['健身','语言表达'];
const DEMO_DIARY_TITLES=['关于专注的思考','健身带来的改变','读书笔记:原则'];
function purgeDemo(){
  DB.habits=DB.habits||[];DB.books=DB.books||{};DB.logs=DB.logs||{};
  const removeIds=DB.habits.filter(h=>DEMO_HABIT_NAMES.includes(h.name)).map(h=>h.id);
  DB.habits=DB.habits.filter(h=>!DEMO_HABIT_NAMES.includes(h.name));
  removeIds.forEach(id=>{delete DB.logs[id];delete DB.books[id];});
  for(const hid in DB.books){
    const demoBookIds=(DB.books[hid]||[]).filter(b=>DEMO_BOOK_TITLES.includes(b.title)).map(b=>b.id);
    if(demoBookIds.length){
      DB.books[hid]=DB.books[hid].filter(b=>!DEMO_BOOK_TITLES.includes(b.title));
      DB.logs[hid]=(DB.logs[hid]||[]).filter(l=>!demoBookIds.includes(l.bookId));
    }
    if(DB.currentBook&&demoBookIds.includes(DB.currentBook))DB.currentBook='';
  }
  DB.diaries=(DB.diaries||[]).filter(d=>!DEMO_DIARY_TITLES.includes(d.title));
  DB.top5=[];
  save();applyTheme();renderDashboard();renderHabits();renderDiary();
}

applyTheme();renderDashboard();renderHabits();renderDiary();
idbRestoreIfEmpty();   // 若本地被清空,自动从 IndexedDB 冗余备份找回
/* 历史打卡记录一次性注入:仅首次、以合并方式写入(不覆盖本地已有数据) */
if(!localStorage.getItem('hist_seed_v1')){
  try{seedHistory();}catch(e){}
  localStorage.setItem('hist_seed_v1','1');
}
/* 数据清洗:一次性清除最初设计代码的示例数据,只保留真实历史记录 */
if(!localStorage.getItem('demo_purge_v1')){
  try{purgeDemo();}catch(e){}
  localStorage.setItem('demo_purge_v1','1');
}
/* 示例数据不再自动灌入(以真实历史记录为准);如需初始演示可手动 loadDemo() */
/* 备份提醒:有数据、且 7 天内未备份时,轻提示引导云端上传 */
window.addEventListener('load',()=>{
  setTimeout(()=>{
    if(dbIsEmpty(DB))return;
    const last=localStorage.getItem('last_backup');
    const stale=!last||((Date.now()-new Date(last).getTime())/864e5>7);
    if(!stale||localStorage.getItem('backup_hint_dismissed')===today())return;
    const bar=document.createElement('div');
    bar.style.cssText='position:absolute;left:12px;right:12px;bottom:150px;z-index:120;background:rgba(31,42,54,.95);color:#fff;border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.5;box-shadow:0 8px 30px rgba(0,0,0,.3);display:flex;gap:10px;align-items:center';
    bar.innerHTML='<span style="font-size:20px">☁︎</span><span style="flex:1">建议定期备份:点右上「⋯」→「云端上传」发送到微信/飞书,防止数据丢失</span><span style="font-size:18px;opacity:.7;padding:0 4px" onclick="this.parentElement.remove();localStorage.setItem(\'backup_hint_dismissed\',(new Date().toISOString().slice(0,10)))">✕</span>';
    document.getElementById("phone").appendChild(bar);
  },2000);
});
</script>
