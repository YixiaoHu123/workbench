<title>个人工作台 · Personal Workbench</title>
<style>
/* ============================================================
   Design Tokens —— 严格对应 PRD 第 2/3/4 节
   ============================================================ */
:root{
  /* Brand & accent */
  --primary:#33475B; --accent:#4C8C9B; --accent-pressed:#3E7482;
  --success:#4C8C9B; --warning:#D9A441; --danger:#C15B4E;
  /* Neutral (Light) */
  --bg-base:#F7F8FA; --bg-card:#FFFFFF; --bg-elev:#FFFFFF;
  --divider:#E8EBEF; --text-1:#1F2A36; --text-2:#5C6B7A; --text-3:#9AA6B2;
  /* Heatmap 5 阶 (Light) */
  --hm0:#EDF0F2; --hm1:#CDE3E8; --hm2:#93C4CE; --hm3:#5FA2B0; --hm4:#1E5F74;
  /* Shadow */
  --shadow:0 2px 8px rgba(31,42,54,.06);
  /* Radius */
  --r-card:16px; --r-sheet:20px; --r-btn:12px; --r-chip:8px;
}
html[data-theme="dark"]{
  --primary:#8FA9BF; --accent:#4C8C9B; --accent-pressed:#47A6B8;
  --success:#58C0D4; --warning:#E6B85C; --danger:#D97768;
  --bg-base:#0F1620; --bg-card:#1A2430; --bg-elev:#22303C;
  --divider:#2A3644; --text-1:#EAEEF2; --text-2:#9BAAB8; --text-3:#6B7A88;
  --hm0:#22303C; --hm1:#2E5561; --hm2:#3B7C8C; --hm3:#469FB2; --hm4:#58C0D4;
  --shadow:none;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;font-family:-apple-system,"SF Pro Text","PingFang SC",system-ui,sans-serif;
  background:#c9ccd1;color:var(--text-1);}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,textarea{font-family:inherit;}

/* ============================================================
   Phone frame —— iPhone 15 Pro 393×852
   ============================================================ */
.stage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;gap:24px;flex-wrap:wrap;}
.phone{width:393px;height:852px;background:var(--bg-base);border-radius:44px;position:relative;overflow:hidden;
  box-shadow:0 20px 60px rgba(0,0,0,.35),0 0 0 12px #1a1a1c,0 0 0 13px #333;transition:background .3s;}
/* status bar */
.statusbar{height:59px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 28px 6px;
  font-size:15px;font-weight:600;color:var(--text-1);position:relative;z-index:5;}
.notch{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:126px;height:34px;background:#000;border-radius:20px;z-index:6;}
.statusbar .right{display:flex;gap:6px;align-items:center;}
/* content scroll area */
.screen{position:absolute;top:59px;bottom:83px;left:0;right:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;}
.screen::-webkit-scrollbar{width:0;}
.page{display:none;padding:0 16px 24px;animation:fade .2s ease;}
.page.active{display:block;}
@keyframes fade{from{opacity:0}to{opacity:1}}
/* tab bar */
.tabbar{position:absolute;bottom:0;left:0;right:0;height:83px;background:var(--bg-card);
  border-top:1px solid var(--divider);display:flex;padding-bottom:20px;z-index:10;transition:background .3s;}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font-size:10px;color:var(--text-3);}
.tabbar button.active{color:var(--accent);}
.tabbar svg{width:24px;height:24px;}

/* ============================================================
   Common components
   ============================================================ */
.h1{font-size:22px;font-weight:600;letter-spacing:-.3px;margin:16px 0 4px;}
.sub{font-size:13px;color:var(--text-2);margin-bottom:14px;}
.card{background:var(--bg-card);border-radius:var(--r-card);padding:16px;box-shadow:var(--shadow);margin-bottom:12px;transition:background .3s,transform .12s;}
html[data-theme="dark"] .card{border:1px solid var(--divider);}
.h2{font-size:18px;font-weight:600;letter-spacing:-.2px;margin:0 0 12px;display:flex;align-items:center;justify-content:space-between;}
.h2 .link{font-size:13px;color:var(--accent);font-weight:500;}
.btn{height:48px;border-radius:var(--r-btn);background:var(--accent);color:#fff;font-size:15px;font-weight:600;
  display:flex;align-items:center;justify-content:center;gap:6px;width:100%;transition:background .15s,transform .12s;}
.btn:active{background:var(--accent-pressed);transform:scale(.98);}
.btn.ghost{background:transparent;border:1.5px solid var(--divider);color:var(--text-1);}
.btn.danger{background:var(--danger);}
.btn.sm{height:38px;font-size:13px;width:auto;padding:0 16px;}
/* segmented control */
.seg{height:32px;background:var(--bg-base);border-radius:8px;display:flex;padding:3px;margin-bottom:14px;}
html[data-theme="dark"] .seg{background:#0b1119;}
.seg button{flex:1;font-size:13px;font-weight:500;color:var(--text-2);border-radius:6px;transition:all .18s;}
.seg button.active{background:var(--bg-card);color:var(--primary);font-weight:600;box-shadow:0 1px 4px rgba(0,0,0,.08);}
/* empty state */
.empty{text-align:center;padding:32px 16px;color:var(--text-3);}
.empty .ico{font-size:40px;margin-bottom:10px;opacity:.5;}
.empty p{font-size:13px;margin:4px 0;}
/* progress bar */
.prog-track{height:8px;border-radius:4px;background:var(--divider);overflow:hidden;}
.prog-fill{height:100%;border-radius:4px;background:var(--accent);transition:width .5s ease;}
/* chips */
.chip{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 10px;border-radius:8px;background:var(--bg-base);
  font-size:12px;color:var(--text-2);}
html[data-theme="dark"] .chip{background:#0b1119;}

/* Heatmap */
.hm-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.hm-cell{aspect-ratio:1;border-radius:8px;background:var(--hm0);display:flex;align-items:center;justify-content:center;
  font-size:10px;color:var(--text-3);cursor:pointer;transition:transform .12s;position:relative;}
.hm-cell:active{transform:scale(.9);}
.hm-cell[data-lv="1"]{background:var(--hm1);}
.hm-cell[data-lv="2"]{background:var(--hm2);color:#fff;}
.hm-cell[data-lv="3"]{background:var(--hm3);color:#fff;}
.hm-cell[data-lv="4"]{background:var(--hm4);color:#fff;}
.hm-cell.today{outline:1.5px solid var(--accent);outline-offset:-1.5px;}
.hm-legend{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text-3);margin-top:10px;justify-content:flex-end;}
.hm-legend .sq{width:12px;height:12px;border-radius:3px;}

/* Donut legend */
.donut-wrap{display:flex;align-items:center;gap:16px;}
.donut{width:130px;height:130px;flex-shrink:0;position:relative;}
.donut .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.donut .center b{font-size:24px;font-weight:600;letter-spacing:-.4px;}
.donut .center span{font-size:11px;color:var(--text-3);}
.legend{flex:1;}
.legend-row{display:flex;align-items:center;gap:8px;font-size:13px;padding:3px 0;}
.legend-row .sq{width:10px;height:10px;border-radius:3px;flex-shrink:0;}
.legend-row .nm{flex:1;color:var(--text-1);}
.legend-row .hr{color:var(--text-2);font-size:12px;}

/* Habit layout */
.habit-wrap{display:flex;gap:0;margin:0 -16px;}
.rail{width:56px;flex-shrink:0;background:var(--bg-card);border-right:1px solid var(--divider);
  padding:8px 0;display:flex;flex-direction:column;align-items:center;gap:6px;transition:width .26s ease;overflow:hidden;min-height:640px;}
.rail.expanded{width:180px;align-items:stretch;padding:8px;}
.rail-item{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;
  position:relative;transition:all .18s;flex-shrink:0;}
.rail.expanded .rail-item{width:100%;height:44px;justify-content:flex-start;padding:0 12px;gap:10px;font-size:18px;}
.rail-item .label{display:none;font-size:15px;color:var(--text-1);white-space:nowrap;}
.rail.expanded .rail-item .label{display:inline;}
.rail-item.active{background:color-mix(in srgb,var(--accent) 14%,transparent);}
.rail-item.active::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:2px;background:var(--accent);}
.rail-add{color:var(--accent);border:1.5px dashed var(--divider);}
.rail-toggle{color:var(--text-3);margin-top:auto;}
.habit-main{flex:1;padding:8px 16px 0;min-width:0;}

/* Today check-in card */
.today-card{background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;border-radius:var(--r-card);
  padding:16px;margin-bottom:14px;position:relative;overflow:hidden;}
html[data-theme="dark"] .today-card{border:none;}
.today-card .lbl{font-size:12px;opacity:.85;}
.today-card .big{font-size:26px;font-weight:600;margin:4px 0 12px;letter-spacing:-.4px;}
.today-card .checkbtn{height:40px;border-radius:10px;background:rgba(255,255,255,.2);color:#fff;font-size:14px;font-weight:600;
  width:100%;display:flex;align-items:center;justify-content:center;gap:6px;backdrop-filter:blur(4px);}
.today-card .checkbtn:active{background:rgba(255,255,255,.32);}

/* Book grid */
.book-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
.book{cursor:pointer;}
.book .cover{aspect-ratio:3/4;border-radius:8px;background:var(--bg-base);border:1px solid var(--divider);
  display:flex;align-items:center;justify-content:center;font-size:24px;color:var(--text-3);overflow:hidden;position:relative;}
.book .cover img{width:100%;height:100%;object-fit:cover;}
.book .bt{font-size:13px;margin-top:6px;font-weight:500;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.book .ba{font-size:12px;color:var(--text-2);}
.book .prog-track{margin-top:5px;height:4px;}

/* Task list (fitness) */
.tlist-item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--divider);align-items:center;}
.tlist-item:last-child{border-bottom:none;}
.tlist-item .thumb{width:56px;height:56px;border-radius:8px;background:var(--bg-base);flex-shrink:0;overflow:hidden;
  display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--text-3);}
.tlist-item .thumb img{width:100%;height:100%;object-fit:cover;}
.tlist-item .info{flex:1;min-width:0;}
.tlist-item .mt{font-size:16px;font-weight:600;}
.tlist-item .st{font-size:12px;color:var(--text-2);margin-top:3px;line-height:1.4;}

/* Diary timeline */
.diary-wrap{display:flex;gap:12px;}
.timeline{width:48px;flex-shrink:0;position:relative;padding-top:8px;}
.timeline::before{content:"";position:absolute;left:23px;top:0;bottom:0;width:2px;background:var(--divider);}
.tl-node{position:relative;font-size:12px;font-weight:500;color:var(--text-2);margin-bottom:24px;padding-left:16px;}
.tl-node::before{content:"";position:absolute;left:1px;top:3px;width:8px;height:8px;border-radius:50%;background:var(--accent);}
.diary-feed{flex:1;min-width:0;}
.diary-card{background:var(--bg-card);border-radius:var(--r-card);padding:16px;box-shadow:var(--shadow);margin-bottom:12px;}
html[data-theme="dark"] .diary-card{border:1px solid var(--divider);}
.diary-card .dtop{display:flex;justify-content:space-between;align-items:center;}
.diary-card .dtitle{font-size:16px;font-weight:600;}
.diary-card .dmeta{font-size:12px;color:var(--text-3);margin:4px 0 8px;display:flex;gap:8px;}
.diary-card .dbody{font-size:14px;color:var(--text-1);line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
.diary-card .datt{display:flex;gap:8px;margin-top:10px;}
.diary-card .datt .a{width:40px;height:40px;border-radius:6px;background:var(--bg-base);display:flex;align-items:center;justify-content:center;font-size:16px;overflow:hidden;}
.diary-card .datt .a img{width:100%;height:100%;object-fit:cover;}

/* ============================================================
   Modal / Bottom sheet
   ============================================================ */
.mask{position:absolute;inset:0;background:rgba(0,0,0,.4);z-index:50;display:none;animation:fade .25s;}
.mask.show{display:block;}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--bg-card);border-radius:var(--r-sheet) var(--r-sheet) 0 0;
  padding:12px 16px calc(20px + env(safe-area-inset-bottom));z-index:51;transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);max-height:88%;overflow-y:auto;}
.sheet.show{transform:translateY(0);}
.sheet::-webkit-scrollbar{width:0;}
.handle{width:36px;height:4px;border-radius:2px;background:var(--text-3);margin:0 auto 14px;opacity:.5;}
.sheet h3{font-size:18px;font-weight:600;margin:0 0 16px;}
.field{margin-bottom:16px;}
.field label{font-size:13px;color:var(--text-2);display:block;margin-bottom:6px;font-weight:500;}
.field input[type=text],.field input[type=number],.field textarea,.field select{
  width:100%;height:44px;border-radius:12px;background:var(--bg-base);border:1.5px solid transparent;
  padding:0 12px;font-size:15px;color:var(--text-1);transition:border .15s;}
.field textarea{height:auto;min-height:72px;padding:12px;resize:vertical;line-height:1.5;}
.field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--accent);}
html[data-theme="dark"] .field input,html[data-theme="dark"] .field textarea,html[data-theme="dark"] .field select{background:#0b1119;}
/* stepper */
.stepper{display:flex;align-items:center;gap:0;height:44px;border-radius:12px;background:var(--bg-base);overflow:hidden;width:160px;}
html[data-theme="dark"] .stepper{background:#0b1119;}
.stepper button{width:44px;height:44px;font-size:20px;color:var(--accent);}
.stepper input{flex:1;text-align:center;background:transparent;border:none;font-size:16px;color:var(--text-1);width:40px;}
/* stars */
.stars{display:flex;gap:8px;}
.stars .s{font-size:26px;color:var(--divider);cursor:pointer;transition:transform .1s;}
.stars .s.on{color:var(--accent);}
.stars .s:active{transform:scale(1.2);}
/* upload */
.upload{width:88px;height:88px;border:1.5px dashed var(--divider);border-radius:12px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:4px;color:var(--text-3);font-size:11px;cursor:pointer;position:relative;overflow:hidden;}
.upload img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.upload input{display:none;}
.upload .ic{font-size:22px;}
.att-row{display:flex;gap:8px;flex-wrap:wrap;}
.att-thumb{width:88px;height:88px;border-radius:12px;overflow:hidden;position:relative;}
.att-thumb img{width:100%;height:100%;object-fit:cover;}
.att-thumb .del{position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;}

/* toast */
.toast{position:absolute;bottom:100px;left:50%;transform:translateX(-50%) translateY(20px);background:rgba(31,42,54,.92);
  color:#fff;font-size:13px;padding:10px 18px;border-radius:20px;z-index:99;opacity:0;transition:all .3s;pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* manage list */
.manage-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--divider);}
.manage-item .ico{width:40px;height:40px;border-radius:10px;background:var(--bg-base);display:flex;align-items:center;justify-content:center;font-size:20px;}
.manage-item .nm{flex:1;font-size:15px;font-weight:500;}
.manage-item .form-tag{font-size:11px;color:var(--text-3);}
.manage-item .del{color:var(--danger);font-size:13px;font-weight:600;padding:6px 10px;border-radius:8px;}

/* top toolbar buttons */
.toolbar{position:absolute;top:14px;right:20px;z-index:7;display:flex;gap:8px;}
.tool-btn{width:30px;height:30px;border-radius:50%;background:rgba(127,140,158,.15);display:flex;align-items:center;justify-content:center;font-size:15px;}

/* controls panel outside phone */
.ext-panel{width:280px;align-self:flex-start;margin-top:8px;}
.ext-panel .card2{background:#fff;border-radius:14px;padding:18px;box-shadow:0 6px 24px rgba(0,0,0,.12);font-size:13px;color:#333;line-height:1.6;}
.ext-panel h4{margin:0 0 10px;font-size:15px;}
.ext-panel .row{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
.ext-panel button{border:1px solid #ddd;border-radius:8px;padding:8px 12px;font-size:12px;background:#f7f8fa;}
.ext-panel button:hover{background:#eef0f3;}
.ext-panel code{background:#f0f0f0;padding:1px 5px;border-radius:4px;font-size:11px;}
.pop{position:absolute;top:52px;right:16px;background:var(--bg-card);border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.2);
  z-index:60;padding:6px;display:none;min-width:150px;border:1px solid var(--divider);}
.pop.show{display:block;}
.pop button{display:block;width:100%;text-align:left;padding:10px 12px;font-size:14px;border-radius:8px;color:var(--text-1);}
.pop button:hover{background:var(--bg-base);}
.pop button.danger{color:var(--danger);}

/* ===== PWA standalone: fill the whole screen, drop the desktop bezel ===== */
@media (display-mode:standalone),(display-mode:fullscreen){
  body{background:var(--bg-base);}
  .stage{display:block;padding:0;min-height:100dvh;}
  .ext-panel{display:none;}
  .phone{width:100vw;height:100dvh;border-radius:0;box-shadow:none;}
  .notch{display:none;}
  /* reserve the iOS system status-bar zone (clock/battery) so our UI never overlaps it */
  .statusbar{height:env(safe-area-inset-top,44px);padding:0;align-items:center;}
  .statusbar .right{display:none;}
  #clock{opacity:0;}
  /* our own tool buttons sit just BELOW the system status bar → fully tappable, no battery overlap */
  .toolbar{top:calc(env(safe-area-inset-top,44px) + 6px);right:16px;}
  /* the menu popover follows the tool buttons down */
  .pop{top:calc(env(safe-area-inset-top,44px) + 44px);}
  /* content starts below both the status bar and the tool-button row */
  .screen{top:calc(env(safe-area-inset-top,44px) + 44px);bottom:calc(60px + env(safe-area-inset-bottom,0px));}
  /* tab bar hugs the very bottom; only the home-indicator inset is added as padding */
  .tabbar{height:calc(60px + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);}
}

</style>
</head>
<body>
<div class="stage">

      <p style="color:#888;margin-top:10px">数据存于浏览器 localStorage(本地备份),可通过「导出/导入」在设备间迁移;云端同步见交付说明。</p>

<script>
/* ============================================================
   防黑屏:全局错误兜底。任何未捕获的 JS 错误都不再留下白/黑屏,
   而是提示一键刷新,避免"打不开/黑屏"的体验。
   ============================================================ */
window.addEventListener('error',function(ev){
  if(document.body&&document.body.getAttribute('data-crashed'))return;
  // 仅当页面看起来空白时才兜底展示
  var phone=document.getElementById('phone');
  if(!phone)return;
  document.body.setAttribute('data-crashed','1');
  var m=document.createElement('div');
  m.style.cssText='position:fixed;inset:0;z-index:9999;background:#F7F8FA;color:#33475B;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:-apple-system,sans-serif;padding:30px;text-align:center';
  m.innerHTML='<div style="font-size:15px;line-height:1.6;margin-bottom:18px">页面遇到一个小问题,你的数据仍安全保存在本地。<br>点击下方按钮重新加载即可。</div><button style="border:none;background:#33475B;color:#fff;padding:12px 26px;border-radius:12px;font-size:15px" onclick="location.reload()">重新加载</button>';
  document.body.appendChild(m);
});
/* ============================================================
   Data layer —— localStorage 本地持久化
   初始为空,示例数据需手动载入
   ============================================================ */
const KEY='workbench_v1';
const DEFAULT={
  habits:[],           // {id,name,icon,form:'flow'|'list'}
  logs:{},             // habitId: [{date,duration,content,rating,atts:[dataURL],bookId}]
  books:{},            // habitId: [{id,title,author,cover,progress}]  ← 阅读类书籍库,与打卡联动
  top5:[],             // {name,progress}
  diaries:[],          // {date,title,weather,mood,body,atts:[{type,url}]}
  theme:'light'
};
let DB=load();
function load(){try{return migrate(Object.assign({},DEFAULT,JSON.parse(localStorage.getItem(KEY))||{}))}catch(e){return JSON.parse(JSON.stringify(DEFAULT))}}
/* 兼容旧数据:把旧版内嵌 log.book 迁移成独立书籍库 + bookId 关联 */
function migrate(db){
  db.books=db.books||{};
  for(const h of (db.habits||[])){
    if(h.form!=='flow')continue;
    db.books[h.id]=db.books[h.id]||[];
    const byTitle={};db.books[h.id].forEach(b=>byTitle[b.title]=b);
    for(const l of (db.logs[h.id]||[])){
      if(l.bookId||!l.book||!l.book.title)continue;
      let b=byTitle[l.book.title];
      if(!b){b={id:uid(),title:l.book.title,author:l.book.author||'',cover:l.book.cover||'',progress:l.book.progress||0};db.books[h.id].push(b);byTitle[b.title]=b;}
      else{if(l.book.progress)b.progress=l.book.progress;if(l.book.cover&&!b.cover)b.cover=l.book.cover;}
      l.bookId=b.id;delete l.book;
    }
  }
  return db;
}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(DB));}catch(e){/* 配额满或隐私模式,静默 */}
  idbBackup();          // 同时写入 IndexedDB 冗余备份(iOS 上比 localStorage 更不易被清空)
}
/* ---- IndexedDB 冗余备份层 ---- */
/* iOS 主屏幕(standalone)模式下,localStorage 有可能被系统回收 / 与 Safari 隔离,
   导致"重新添加书签后数据消失"。这里额外把数据镜像到 IndexedDB,
   启动时若 localStorage 为空则自动从 IndexedDB 找回,双保险。 */
let _idb=null;
function idbOpen(){return new Promise((res,rej)=>{
  if(_idb)return res(_idb);
  if(!window.indexedDB)return rej('no-idb');
  const q=indexedDB.open('workbench_db',1);
  q.onupgradeneeded=e=>{const d=e.target.result;if(!d.objectStoreNames.contains('kv'))d.createObjectStore('kv');};
  q.onsuccess=e=>{_idb=e.target.result;res(_idb);};
  q.onerror=e=>rej(e);
});}
function idbBackup(){idbOpen().then(db=>{db.transaction('kv','readwrite').objectStore('kv').put(JSON.stringify(DB),KEY);}).catch(()=>{});}
function idbLoad(){return new Promise(res=>{idbOpen().then(db=>{const r=db.transaction('kv','readonly').objectStore('kv').get(KEY);r.onsuccess=()=>res(r.result||null);r.onerror=()=>res(null);}).catch(()=>res(null));});}
function dbIsEmpty(d){return (!d.habits||!d.habits.length)&&(!d.diaries||!d.diaries.length)&&Object.keys(d.logs||{}).length===0;}
/* 启动时:若本地为空,尝试从 IndexedDB 冗余备份恢复 */
function idbRestoreIfEmpty(){
  if(!dbIsEmpty(DB))return;
  idbLoad().then(js=>{
    if(!js)return;
    try{const d=migrate(Object.assign({},JSON.parse(JSON.stringify(DEFAULT)),JSON.parse(js)));
      if(!dbIsEmpty(d)){DB=d;save();applyTheme();renderDashboard();renderHabits();renderDiary();toast('已从本地备份自动找回数据');}
    }catch(e){}
  });
}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
const today=()=>new Date().toISOString().slice(0,10);

/* ============================================================
   Theme
   ============================================================ */
function applyTheme(){document.documentElement.dataset.theme=DB.theme;document.getElementById('themeBtn').textContent=DB.theme==='dark'?'☀':'☾';}
document.getElementById('themeBtn').onclick=()=>{DB.theme=DB.theme==='dark'?'light':'dark';save();applyTheme();};

/* ============================================================
   Clock
   ============================================================ */
function tick(){const d=new Date();document.getElementById('clock').textContent=d.getHours()+':'+String(d.getMinutes()).padStart(2,'0');}
tick();setInterval(tick,10000);

/* ============================================================
   Menu popover
   ============================================================ */
const menuPop=document.getElementById('menuPop');

document.getElementById('calSeg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;calMode=b.dataset.v;document.querySelectorAll('#calSeg button').forEach(x=>x.classList.toggle('active',x===b));renderHeatmap();});

// completion level for a date = number of distinct habits checked that day (cap 4)
function levelOf(date){let n=0;for(const hid in DB.logs){if((DB.logs[hid]||[]).some(l=>l.date===date))n++;}return Math.min(n,4);}
function durationsBy(mode){
  const now=new Date();const totals={};
  for(const h of DB.habits){totals[h.id]=0;}
  for(const hid in DB.logs){for(const l of DB.logs[hid]){
    const d=new Date(l.date);let ok=false;
    if(mode==='week'){const diff=(now-d)/864e5;ok=diff>=0&&diff<7;}
    else if(mode==='month'){ok=d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear();}
    else{ok=d.getFullYear()===now.getFullYear();}
    if(ok)totals[hid]=(totals[hid]||0)+(Number(l.duration)||0);
  }}
  return totals;
}
function renderHeatmap(){
  const el=document.getElementById('heatmap');
  const now=new Date();let days=[];
  if(calMode==='week'){for(let i=6;i>=0;i--){const d=new Date(now);d.setDate(now.getDate()-i);days.push(d);}}
  else if(calMode==='month'){const y=now.getFullYear(),m=now.getMonth();const last=new Date(y,m+1,0).getDate();for(let i=1;i<=last;i++)days.push(new Date(y,m,i));}
  else{const y=now.getFullYear();for(let i=0;i<364;i++){const d=new Date(y,0,1);d.setDate(d.getDate()+i);days.push(d);}}
  const cols=calMode==='year'?14:7;
  el.style.setProperty('display','grid');
  el.className='hm-grid';el.style.gridTemplateColumns=`repeat(${cols},1fr)`;el.style.gap=calMode==='year'?'3px':'4px';
  const tdy=today();
  el.innerHTML=days.map(d=>{
    const ds=d.toISOString().slice(0,10);const lv=levelOf(ds);
    const txt=calMode==='year'?'':d.getDate();
    return `<div class="hm-cell ${ds===tdy?'today':''}" data-lv="${lv}" data-date="${ds}" onclick="showDay('${ds}')">${txt}</div>`;
  }).join('');
}
function showDay(ds){
  let items=[];for(const h of DB.habits){const l=(DB.logs[h.id]||[]).find(x=>x.date===ds);if(l)items.push(`${h.icon} ${h.name} · ${l.duration||0}min`);}
  openSheet(`<h3>${ds}</h3>${items.length?items.map(i=>`<div class="chip" style="margin:0 6px 8px 0">${i}</div>`).join(''):'<div class="empty"><div class="ico">◷</div><p>这天还没有打卡记录</p></div>'}<button class="btn ghost" onclick="closeSheet(true)">关闭</button>`);
}
function renderDonut(){
  const area=document.getElementById('donutArea');
  const totals=durationsBy(donutMode);
  const items=DB.habits.map(h=>({name:h.name,icon:h.icon,val:totals[h.id]||0})).filter(x=>x.val>0).sort((a,b)=>b.val-a.val);
  const sum=items.reduce((s,x)=>s+x.val,0);
  if(sum===0){area.innerHTML='<div class="empty"><div class="ico">◔</div><p>暂无投入时间数据</p><p>去「习惯」页打卡后自动统计</p></div>';return;}
  const palette=['#33475B','#4C8C9B','#7FB4BF','#A7CDD4','#D9A441','#C15B4E','#6B7A88'];
  let acc=0;const segs=items.map((x,i)=>{const pct=x.val/sum*100;const s=`${palette[i%palette.length]} ${acc}% ${acc+pct}%`;acc+=pct;return s;});
  const hrs=(sum/60).toFixed(1);
  area.innerHTML=`<div class="donut-wrap">
    <div class="donut" style="background:conic-gradient(${segs.join(',')});border-radius:50%">
      <div style="position:absolute;inset:26px;background:var(--bg-card);border-radius:50%"></div>
      <div class="center"><b>${hrs}h</b><span>${donutMode==='week'?'本周':donutMode==='month'?'本月':'本年'}投入</span></div>
    </div>
    <div class="legend">${items.map((x,i)=>`<div class="legend-row"><span class="sq" style="background:${palette[i%palette.length]}"></span><span class="nm">${x.icon} ${x.name}</span><span class="hr">${(x.val/60).toFixed(1)}h</span></div>`).join('')}</div>
  </div>`;
}
function renderTop5(){
  const el=document.getElementById('topList');
  if(!DB.top5.length){el.innerHTML='<div class="empty"><div class="ico">◇</div><p>还没有月度核心任务</p><p>点击右上「编辑」添加</p></div>';return;}
  const sorted=[...DB.top5].sort((a,b)=>{const ca=a.progress>=100,cb=b.progress>=100;if(ca!==cb)return ca?1:-1;return b.progress-a.progress;});
  el.innerHTML=sorted.map(t=>`<div style="margin-bottom:14px;opacity:${t.progress>=100?.55:1}">
    <div style="display:flex;justify-content:space-between;font-size:15px;margin-bottom:6px"><span style="font-weight:500">${t.progress>=100?'✓ ':''}${t.name}</span><span style="font-size:13px;color:var(--text-2)">${t.progress}%</span></div>
    <div class="prog-track"><div class="prog-fill" style="width:${t.progress}%"></div></div></div>`).join('');
}
function openTopEditor(){

    <button class="btn ghost sm" style="width:100%;margin-bottom:12px" onclick="if(DB.top5.length<5){DB.top5.push({name:'新任务',progress:0});save();openTopEditor()}else toast('最多 5 项')">＋ 添加任务</button>

}

let activeHabit=null, railExpanded=false;
function renderHabits(){
  const rail=document.getElementById('rail');
  rail.className='rail'+(railExpanded?' expanded':'');
  let items=DB.habits.map(h=>`<div class="rail-item ${activeHabit===h.id?'active':''}" onclick="selectHabit('${h.id}')"><span>${h.icon}</span><span class="label">${h.name}</span></div>`).join('');
  items+=`<div class="rail-item rail-add" onclick="openHabitEditor()"><span>＋</span><span class="label">新建习惯</span></div>`;
  items+=`<div class="rail-item rail-toggle" onclick="railExpanded=!railExpanded;renderHabits()"><span>${railExpanded?'⟨':'⟩'}</span><span class="label">收起</span></div>`;
  rail.innerHTML=items;
  const main=document.getElementById('habitMain');
  if(!DB.habits.length){main.innerHTML='<div class="empty"><div class="ico">✦</div><p>还没有习惯模块</p><p>点击左侧「＋」新建你的第一个习惯</p></div>';return;}
  if(!activeHabit||!DB.habits.find(h=>h.id===activeHabit))activeHabit=DB.habits[0].id;
  const h=DB.habits.find(x=>x.id===activeHabit);
  const logs=(DB.logs[h.id]||[]).slice().sort((a,b)=>b.date.localeCompare(a.date));
  const tlog=logs.find(l=>l.date===today());
  let html=`<div class="today-card">
    <div class="lbl">${h.icon} ${h.name} · 今日</div>
    <div class="big">${tlog?(tlog.duration||0)+' min':'未打卡'}</div>
    <button class="checkbtn" onclick="openLogEditor('${h.id}')">＋ 今日打卡</button></div>`;
  if(h.form==='flow'){
    // reading style: 当前在读(可编辑+快速打卡) + 历史书籍(可编辑进度)
    const books=DB.books[h.id]||[];
    // 累计每本书投入时长
    const timeByBook={};for(const l of (DB.logs[h.id]||[])){if(l.bookId)timeByBook[l.bookId]=(timeByBook[l.bookId]||0)+(Number(l.duration)||0);}
    const reading=books.filter(b=>(b.progress||0)<100);
    const finished=books.filter(b=>(b.progress||0)>=100);
    // —— 当前在读 ——
    html+=`<div class="card"><div class="h2">当前在读<span class="link" onclick="openBookEditor('${h.id}','')">＋ 添加</span></div>`;
    if(reading.length){
      html+=reading.map(b=>`<div class="tlist-item" style="align-items:center">
        <div class="thumb">${b.cover?`<img src="${b.cover}">`:'📖'}</div>
        <div class="info"><div class="mt">${b.title}</div>
          <div class="st">${b.author||'—'} · 累计 ${((timeByBook[b.id]||0)/60).toFixed(1)}h · ${b.progress||0}%</div>
          <div class="prog-track" style="margin-top:6px"><div class="prog-fill" style="width:${b.progress||0}%"></div></div></div>
        <button class="btn ghost sm" style="width:auto;padding:6px 10px;margin:0 0 0 8px" onclick="quickCheck('${h.id}','${b.id}')">打卡</button>
        <button class="btn ghost sm" style="width:auto;padding:6px 10px;margin:0 0 0 6px" onclick="openBookEditor('${h.id}','${b.id}')">编辑</button>
      </div>`).join('');
    }else html+=`<div class="empty" style="padding:12px"><p>点右上「＋ 添加」登记在读的书,或今日打卡时新建</p></div>`;
    html+=`</div>`;
    // —— 历史书籍(读完) ——
    html+=`<div class="card"><div class="h2">历史书籍</div>`;
    if(finished.length){html+=`<div class="book-grid">${finished.map(b=>`<div class="book" onclick="openBookEditor('${h.id}','${b.id}')"><div class="cover">${b.cover?`<img src="${b.cover}">`:'📖'}</div><div class="bt">${b.title}</div><div class="ba">${b.author||'—'} · ${((timeByBook[b.id]||0)/60).toFixed(1)}h</div><div class="prog-track"><div class="prog-fill" style="width:100%"></div></div></div>`).join('')}</div>`;}
    else html+=`<div class="empty" style="padding:12px"><p>进度达到 100% 的书会归档到这里,点书可再次编辑</p></div>`;
    html+=`</div>`;
  }else{
    // fitness style: task list
    html+=`<div class="card"><div class="h2">历史记录</div>`;
    if(logs.length){html+=logs.map(l=>`<div class="tlist-item"><div class="thumb">${l.atts&&l.atts[0]?`<img src="${l.atts[0]}">`:h.icon}</div><div class="info"><div class="mt">${l.date} · ${l.duration||0}min</div><div class="st">${l.content||'（无备注）'}${l.rating?' · '+'★'.repeat(l.rating):''}</div></div></div>`).join('');}
    else html+=`<div class="empty" style="padding:12px"><p>还没有历史记录,去打卡吧</p></div>`;
    html+=`</div>`;
  }
  main.innerHTML=html;
}

function saveHabit(editId){

  else DB.habits.push({id:uid(),name,icon,form:document.getElementById('hForm').value});
  save();closeSheet(true);renderHabits();toast(editId?'习惯已更新':'习惯已创建');
}
let logAtts=[],logCover='';
function openLogEditor(hid,preBookId){
  const h=DB.habits.find(x=>x.id===hid);logAtts=[];logCover='';
  const isFlow=h.form==='flow';
  const books=DB.books[hid]||[];
  const tlog=(DB.logs[hid]||[]).find(l=>l.date===today());
  const bookId=preBookId||(tlog&&tlog.bookId)||(books.find(b=>(b.progress||0)<100)||{}).id||'';
  const selBook=books.find(b=>b.id===bookId);
  openSheet(`<h3>${h.icon} ${h.name} · 今日打卡</h3>
    ${isFlow?`<div class="field"><label>选择书籍</label>
      <select id="lBookSel" onchange="onLogBookChange('${hid}')">
        ${books.map(b=>`<option value="${b.id}" ${b.id===bookId?'selected':''}>${b.title}${(b.progress||0)>=100?' ✓已读完':''}</option>`).join('')}
        <option value="__new">＋ 新增一本书…</option>
      </select></div>
      <div id="newBookBox" style="display:${books.length?'none':'block'}">
        <div class="field"><label>书名</label><input type="text" id="lBookT" placeholder="书名"></div>
        <div class="field"><label>作者</label><input type="text" id="lBookA" placeholder="作者"></div>
        <div class="field"><label>封面</label><div class="upload" onclick="this.querySelector('input').click()"><span class="ic">＋</span>封面<input type="file" accept="image/*" onchange="readCover(this)"><span id="coverPrev"></span></div></div>
      </div>
      <div class="field"><label>阅读进度 %(打卡后自动更新到该书)</label>
        <input type="number" id="lBookP" min="0" max="100" value="${selBook?selBook.progress||0:0}" placeholder="0-100"></div>`:''}
    <div class="field"><label>投入时间(分钟)${isFlow?'　·　只改时间也可完成打卡':''}</label>
      <div class="stepper"><button onclick="stepDur(-5)">−</button><input type="number" id="lDur" value="30"><button onclick="stepDur(5)">＋</button></div></div>
    <div class="field"><label>内容 / 备注</label><textarea id="lContent" placeholder="${isFlow?'读了哪部分、收获…':'练了什么、体验如何…'}"></textarea></div>
    <div class="field"><label>今日评分</label><div class="stars" id="stars">${[1,2,3,4,5].map(i=>`<span class="s" data-v="${i}" onclick="setStar(${i})">★</span>`).join('')}</div></div>
    <div class="field"><label>上传附件(图片)</label><div class="att-row" id="attRow"><div class="upload" onclick="this.querySelector('input').click()"><span class="ic">＋</span>照片<input type="file" accept="image/*" multiple onchange="readAtts(this)"></div></div></div>
    <button class="btn" onclick="saveLog('${hid}')">保存打卡</button>`);
}
function onLogBookChange(hid){
  const sel=document.getElementById('lBookSel');const box=document.getElementById('newBookBox');
  const isNew=sel.value==='__new';box.style.display=isNew?'block':'none';
  const b=(DB.books[hid]||[]).find(x=>x.id===sel.value);
  if(b&&!isNew)document.getElementById('lBookP').value=b.progress||0;
}
function stepDur(d){const el=document.getElementById('lDur');el.value=Math.max(0,(+el.value||0)+d);}
let curStar=0;function setStar(v){curStar=v;document.querySelectorAll('#stars .s').forEach(s=>s.classList.toggle('on',+s.dataset.v<=v));}
function readCover(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=e=>{logCover=e.target.result;document.getElementById('coverPrev').innerHTML=`<img src="${logCover}">`;};r.readAsDataURL(f);}
function readAtts(inp){[...inp.files].forEach(f=>{const r=new FileReader();r.onload=e=>{logAtts.push(e.target.result);renderAttRow();};r.readAsDataURL(f);});}
function renderAttRow(){const row=document.getElementById('attRow');row.querySelectorAll('.att-thumb').forEach(x=>x.remove());logAtts.forEach((a,i)=>{const d=document.createElement('div');d.className='att-thumb';d.innerHTML=`<img src="${a}"><div class="del" onclick="logAtts.splice(${i},1);renderAttRow()">✕</div>`;row.appendChild(d);});}
function saveLog(hid){
  const h=DB.habits.find(x=>x.id===hid);
  const log={date:today(),duration:+document.getElementById('lDur').value||0,content:document.getElementById('lContent').value.trim(),rating:curStar,atts:logAtts.slice()};
  if(h.form==='flow'){
    DB.books[hid]=DB.books[hid]||[];
    const sel=document.getElementById('lBookSel');let bookId=sel?sel.value:'';
    const prog=Math.max(0,Math.min(100,+document.getElementById('lBookP').value||0));
    if(bookId==='__new'||(!bookId&&document.getElementById('lBookT'))){
      const t=(document.getElementById('lBookT')||{}).value?document.getElementById('lBookT').value.trim():'';
      if(t){const nb={id:uid(),title:t,author:(document.getElementById('lBookA')||{}).value?document.getElementById('lBookA').value.trim():'',cover:logCover,progress:prog};DB.books[hid].push(nb);bookId=nb.id;}
      else bookId='';
    }else if(bookId){
      const b=DB.books[hid].find(x=>x.id===bookId);if(b)b.progress=prog;   // ← 打卡回写书籍进度,实现联动
    }
    if(bookId)log.bookId=bookId;
  }
  DB.logs[hid]=DB.logs[hid]||[];
  const ex=DB.logs[hid].findIndex(l=>l.date===today());
  if(ex>=0)DB.logs[hid][ex]=log;else DB.logs[hid].push(log);
  curStar=0;save();closeSheet(true);renderHabits();renderDashboard();toast('✓ 今日已点亮日历');
}

/* 书籍编辑:新增 / 修改书名·作者·封面·进度;进度=100 自动归档到历史书籍 */
function openBookEditor(hid,bookId){
  const books=DB.books[hid]||[];const b=bookId?books.find(x=>x.id===bookId):null;
  openSheet(`<h3>${b?'编辑书籍':'添加书籍'}</h3>
    <div class="field"><label>书名</label><input type="text" id="bkT" value="${b?b.title.replace(/"/g,'&quot;'):''}" placeholder="书名"></div>
    <div class="field"><label>作者</label><input type="text" id="bkA" value="${b?(b.author||'').replace(/"/g,'&quot;'):''}" placeholder="作者"></div>
    <div class="field"><label>阅读进度 %</label><input type="number" id="bkP" min="0" max="100" value="${b?b.progress||0:0}"></div>
    <div class="field"><label>封面</label><div class="upload" onclick="this.querySelector('input').click()"><span class="ic">＋</span>封面<input type="file" accept="image/*" onchange="readBookCover(this)"><span id="bkCoverPrev">${b&&b.cover?`<img src="${b.cover}">`:''}</span></div></div>
    <button class="btn" onclick="saveBook('${hid}','${bookId||''}')">${b?'保存':'添加'}</button>
    ${b?`<button class="btn danger sm" style="width:100%;margin-top:10px" onclick="delBook('${hid}','${bookId}')">删除这本书</button>`:''}`);
  bookCover=b&&b.cover?b.cover:'';
}
let bookCover='';
function readBookCover(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=e=>{bookCover=e.target.result;document.getElementById('bkCoverPrev').innerHTML=`<img src="${bookCover}">`;};r.readAsDataURL(f);}
function saveBook(hid,bookId){
  const t=document.getElementById('bkT').value.trim();if(!t){toast('请填写书名');return;}
  const a=document.getElementById('bkA').value.trim();const p=Math.max(0,Math.min(100,+document.getElementById('bkP').value||0));
  DB.books[hid]=DB.books[hid]||[];
  if(bookId){const b=DB.books[hid].find(x=>x.id===bookId);if(b){b.title=t;b.author=a;b.progress=p;if(bookCover)b.cover=bookCover;}}
  else DB.books[hid].push({id:uid(),title:t,author:a,progress:p,cover:bookCover});
  bookCover='';save();closeSheet(true);renderHabits();toast(bookId?'书籍已更新':'书籍已添加');
}
function delBook(hid,bookId){
  if(!confirm('删除这本书?已有的打卡时长记录会保留,但不再关联书籍。'))return;
  DB.books[hid]=(DB.books[hid]||[]).filter(b=>b.id!==bookId);
  (DB.logs[hid]||[]).forEach(l=>{if(l.bookId===bookId)delete l.bookId;});
  save();closeSheet(true);renderHabits();toast('已删除');
}

/* ============================================================
   DIARY
   ============================================================ */
let diaryAtts=[];
function renderDiary(){
  const area=document.getElementById('diaryArea');
  if(!DB.diaries.length){area.innerHTML='<div class="empty"><div class="ico">✎</div><p>还没有日记</p><p>点击右上「＋ 写日记」开始记录</p></div>';return;}
  const sorted=[...DB.diaries].sort((a,b)=>b.date.localeCompare(a.date));
  // group by year-month
  const groups={};sorted.forEach(d=>{const k=d.date.slice(0,7);(groups[k]=groups[k]||[]).push(d);});
  let html='<div class="diary-wrap"><div class="timeline">';
  html+=Object.keys(groups).map(k=>`<div class="tl-node">${k.slice(0,4)}<br>${k.slice(5)}月</div>`).join('');
  html+='</div><div class="diary-feed">';
  sorted.forEach((d,i)=>{
    html+=`<div class="diary-card" onclick="expandDiary(${DB.diaries.indexOf(d)})">
      <div class="dtop"><span class="dtitle">${d.title||'无题'}</span><span style="font-size:22px">${d.mood||''}</span></div>
      <div class="dmeta"><span>${d.date}</span><span>${d.weather||''}</span></div>
      <div class="dbody">${(d.body||'').replace(/</g,'&lt;')}</div>
      ${d.atts&&d.atts.length?`<div class="datt">${d.atts.map(a=>`<div class="a">${a.type==='image'?`<img src="${a.url}">`:a.type==='video'?'🎬':'🎵'}</div>`).join('')}</div>`:''}
    </div>`;
  });
  html+='</div></div>';
  area.innerHTML=html;
}
function expandDiary(idx){
  const d=DB.diaries[idx];
  openSheet(`<h3>${d.title||'无题'} <span style="font-size:22px;float:right">${d.mood||''}</span></h3>
    <div class="dmeta" style="font-size:13px;color:var(--text-3);margin-bottom:14px">${d.date} · ${d.weather||''}</div>
    <div style="font-size:15px;line-height:1.7;white-space:pre-wrap;margin-bottom:16px">${(d.body||'').replace(/</g,'&lt;')}</div>
    ${d.atts&&d.atts.length?`<div class="att-row">${d.atts.map(a=>a.type==='image'?`<div class="att-thumb"><img src="${a.url}"></div>`:`<div class="upload">${a.type==='video'?'🎬':'🎵'}</div>`).join('')}</div>`:''}
    <button class="btn" style="width:100%;margin-top:16px" onclick="openDiaryEditor(${idx})">✎ 编辑这篇</button>
    <button class="btn danger sm" style="width:100%;margin-top:10px" onclick="DB.diaries.splice(${idx},1);save();closeSheet(true);renderDiary();toast('已删除')">删除这篇</button>`);
}
function openDiaryEditor(idx){
  const editing=(typeof idx==='number');
  const d=editing?DB.diaries[idx]:null;
  diaryAtts=editing&&d.atts?d.atts.slice():[];
  curMood=editing?(d.mood||''):'';
  const moods=['😄','🙂','😐','😔','😤','🤔','😴'];
  openSheet(`<h3>${editing?'编辑日记':'写日记'}</h3>
    <div class="field"><label>标题</label><input type="text" id="dTitle" placeholder="今天的标题" value="${editing?(d.title||'').replace(/"/g,'&quot;'):''}"></div>
    <div class="field" style="display:flex;gap:8px"><div style="flex:1"><label>日期</label><input type="text" id="dDate" value="${editing?d.date:today()}"></div><div style="flex:1"><label>天气</label><input type="text" id="dWeather" placeholder="☀️ 晴 / 🌧 雨" value="${editing?(d.weather||'').replace(/"/g,'&quot;'):''}"></div></div>
    <div class="field"><label>心情</label><div class="stars" id="moodRow" style="font-size:24px">${moods.map(m=>`<span data-m="${m}" onclick="setMood('${m}',this)" style="cursor:pointer;opacity:${editing&&d.mood===m?'1':'.4'}">${m}</span>`).join('')}</div></div>
    <div class="field"><label>正文</label><textarea id="dBody" style="min-height:120px" placeholder="今天的所思所想、认知迭代…">${editing?(d.body||'').replace(/</g,'&lt;'):''}</textarea></div>
    <div class="field"><label>附件(图片/视频/音频)</label><div class="att-row" id="dAttRow"><div class="upload" onclick="this.querySelector('input').click()"><span class="ic">＋</span>附件<input type="file" accept="image/*,video/*,audio/*" multiple onchange="readDiaryAtts(this)"></div></div></div>
    <button class="btn" onclick="saveDiary(${editing?idx:''})">${editing?'保存修改':'保存日记'}</button>`);
  renderDiaryAtt();
}
let curMood='';
function setMood(m,el){curMood=m;document.querySelectorAll('#moodRow span').forEach(s=>s.style.opacity=s===el?'1':'.4');}
function readDiaryAtts(inp){[...inp.files].forEach(f=>{const type=f.type.startsWith('image')?'image':f.type.startsWith('video')?'video':'audio';const r=new FileReader();r.onload=e=>{diaryAtts.push({type,url:e.target.result});renderDiaryAtt();};r.readAsDataURL(f);});}
function renderDiaryAtt(){const row=document.getElementById('dAttRow');if(!row)return;row.querySelectorAll('.att-thumb,.att-file').forEach(x=>x.remove());diaryAtts.forEach((a,i)=>{const d=document.createElement('div');d.className='att-thumb';d.innerHTML=(a.type==='image'?`<img src="${a.url}">`:`<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:var(--bg-base);font-size:22px">${a.type==='video'?'🎬':'🎵'}</div>`)+`<div class="del" onclick="diaryAtts.splice(${i},1);renderDiaryAtt()">✕</div>`;row.appendChild(d);});}
function saveDiary(idx){
  const title=document.getElementById('dTitle').value.trim();const body=document.getElementById('dBody').value.trim();
  if(!title&&!body){toast('写点什么吧');return;}
  const rec={date:document.getElementById('dDate').value||today(),title,weather:document.getElementById('dWeather').value.trim(),mood:curMood,body,atts:diaryAtts.slice()};
  if(typeof idx==='number')DB.diaries[idx]=rec;else DB.diaries.push(rec);
  curMood='';diaryAtts=[];save();closeSheet(true);renderDiary();toast(typeof idx==='number'?'日记已更新':'日记已保存');
}

/* ============================================================
   MANAGE / DELETE  (删除窗口)
   ============================================================ */
function openManage(){
  const rows=DB.habits.map((h,i)=>`<div class="manage-item"><div class="ico">${h.icon}</div><div class="nm">${h.name}<div class="form-tag">${h.form==='flow'?'图片信息流':'任务清单'}</div></div><button class="del" style="background:var(--bg-base);color:var(--accent);margin-right:6px" onclick="openHabitEditor('${h.id}')">编辑</button><button class="del" onclick="delHabit('${h.id}')">删除</button></div>`).join('');
  openSheet(`<h3>管理 / 编辑 / 删除习惯</h3>
    ${DB.habits.length?rows:'<div class="empty" style="padding:20px"><p>暂无习惯模块</p></div>'}
    <button class="btn ghost" style="margin-top:12px" onclick="openHabitEditor()">＋ 新建习惯</button>
    <p style="font-size:12px;color:var(--text-3);margin-top:14px;text-align:center">「编辑」可改名称与 emoji 图标;删除习惯将同时清除其打卡记录</p>`);
}
function delHabit(id){
  if(!confirm('确认删除该习惯及其全部打卡记录?'))return;
  DB.habits=DB.habits.filter(h=>h.id!==id);delete DB.logs[id];delete DB.books[id];if(activeHabit===id)activeHabit=null;
  save();openManage();renderHabits();toast('已删除');
}

/* ============================================================
   BACKUP —— export / import / reset (本地+可迁移)
   ============================================================ */
function exportData(){
  const name='workbench-backup-'+today()+'.json';
  const blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();
  localStorage.setItem('last_backup',today());
  toast('已导出备份文件');
}
/* 云端上传:通过系统分享面板发送到微信 / 飞书等 */
async function shareCloud(){
  const name='workbench-backup-'+today()+'.json';
  const json=JSON.stringify(DB,null,2);
  const blob=new Blob([json],{type:'application/json'});
  try{
    const file=new File([blob],name,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:'工作台数据备份',text:'工作台数据备份 '+today()});
      localStorage.setItem('last_backup',today());toast('已调起分享,可发送到微信/飞书');return;
    }
    if(navigator.share){ // 不支持文件时退化为分享文本
      await navigator.share({title:'工作台数据备份',text:json});
      localStorage.setItem('last_backup',today());toast('已调起分享');return;
    }
  }catch(e){if(e&&e.name==='AbortError')return;/* 用户取消 */}
  // 完全不支持分享:退化为下载,提示手动上传
  exportData();toast('当前环境不支持直接分享,已导出文件,请手动上传到微信/飞书');
}
function importData(){
  const inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';
  inp.onchange=()=>{const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=e=>{try{
    const parsed=JSON.parse(e.target.result);
    DB=migrate(Object.assign({},JSON.parse(JSON.stringify(DEFAULT)),parsed));
    save();applyTheme();renderDashboard();renderHabits();renderDiary();toast('已导入并写入本地存储');
  }catch(err){toast('文件格式错误,导入失败');}};r.readAsText(f);};
  inp.click();
}
function resetAll(){if(!confirm('确认清空全部数据?此操作不可撤销。建议先「导出数据」备份。'))return;DB=JSON.parse(JSON.stringify(DEFAULT));save();applyTheme();activeHabit=null;renderDashboard();renderHabits();renderDiary();toast('已清空,回到初始态');}

/* ===== PWA: service worker (inline via Blob) for installability + offline shell ===== */
/* NOTE: The previous inline Blob-URL Service Worker was removed.
   On iOS, a SW registered via a blob: URL can hijack fetch requests and
   return empty responses in standalone (home-screen) mode, causing a blank
   screen and a false "lost network connection" error.
   We also proactively unregister any old SW and purge its cache so devices
   that already installed the broken version recover automatically. */
if('serviceWorker' in navigator){
  navigator.serviceWorker.getRegistrations()
    .then(rs=>rs.forEach(r=>r.unregister())).catch(()=>{});
}
if(window.caches){
  caches.keys().then(ks=>ks.forEach(k=>caches.delete(k))).catch(()=>{});
}
/* Add-to-home-screen hint (only on iOS Safari, non-standalone) */
window.addEventListener('load',()=>{
  const isStandalone=window.matchMedia('(display-mode:standalone)').matches||window.navigator.standalone;
  const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
  if(isIOS && !isStandalone && !localStorage.getItem('a2hs_dismissed')){
    setTimeout(()=>{
      const bar=document.createElement('div');
      bar.style.cssText='position:absolute;left:12px;right:12px;bottom:96px;z-index:120;background:rgba(31,42,54,.95);color:#fff;border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.5;box-shadow:0 8px 30px rgba(0,0,0,.3);display:flex;gap:10px;align-items:center';
      bar.innerHTML='<span style="font-size:20px">⤴︎</span><span style="flex:1">点击 Safari 底部「分享」→「添加到主屏幕」，即可像 App 一样全屏使用</span><span style="font-size:18px;opacity:.7;padding:0 4px" onclick="this.parentElement.remove();localStorage.setItem(\'a2hs_dismissed\',1)">✕</span>';
      document.getElementById("phone").appendChild(bar);
    },1200);
  }
});

/* ============================================================
   INIT
   ============================================================ */
applyTheme();renderDashboard();renderHabits();renderDiary();
idbRestoreIfEmpty();   // 若本地被清空,自动从 IndexedDB 冗余备份找回
/* 备份提醒:有数据、且 7 天内未备份时,轻提示引导云端上传 */
window.addEventListener('load',()=>{
  setTimeout(()=>{
    if(dbIsEmpty(DB))return;
    const last=localStorage.getItem('last_backup');
    const stale=!last||((Date.now()-new Date(last).getTime())/864e5>7);
    if(!stale||localStorage.getItem('backup_hint_dismissed')===today())return;
    const bar=document.createElement('div');
    bar.style.cssText='position:absolute;left:12px;right:12px;bottom:150px;z-index:120;background:rgba(31,42,54,.95);color:#fff;border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.5;box-shadow:0 8px 30px rgba(0,0,0,.3);display:flex;gap:10px;align-items:center';
    bar.innerHTML='<span style="font-size:20px">☁︎</span><span style="flex:1">建议定期备份:点右上「⋯」→「云端上传」发送到微信/飞书,防止数据丢失</span><span style="font-size:18px;opacity:.7;padding:0 4px" onclick="this.parentElement.remove();localStorage.setItem(\'backup_hint_dismissed\',(new Date().toISOString().slice(0,10)))">✕</span>';
    document.getElementById("phone").appendChild(bar);
  },2000);
});
</script>
